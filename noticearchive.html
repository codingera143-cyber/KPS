<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notice Archive | K.P.S. Kannauj</title>
    <link rel="stylesheet" href="index.css">
    <style>
      :root {
    --primary: #1e293b;
    --accent: #3b82f6;
    --text-main: #334155;
    --text-light: #64748b;
    --bg-body: #f1f5f9;
}

body {
    background-color: var(--bg-body);
    font-family: 'Plus Jakarta Sans', sans-serif;
    margin: 0;
    color: var(--text-main);
}

.app-container {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
}

/* --- Modern Header & Back Link --- */
.archive-header {
    text-align: center;
    padding: 40px 0 30px;
}

.back-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: var(--accent);
    font-weight: 700;
    font-size: 0.9rem;
    background: #ffffff;
    padding: 10px 20px;
    border-radius: 50px;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    transition: all 0.3s ease;
    margin-bottom: 25px;
}

.back-link:hover {
    transform: translateX(-5px);
    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
    background: var(--accent);
    color: white;
}

.archive-header h1 {
    font-size: 2.2rem;
    margin: 0;
    color: var(--primary);
    letter-spacing: -1px;
}

.archive-header h1 span {
    color: var(--accent);
}

.subtitle {
    color: var(--text-light);
    margin-top: 8px;
    font-size: 1rem;
}

/* --- Card UI Improvement --- */
.archive-card {
    background: white;
    border-radius: 20px;
    padding: 25px;
    margin-bottom: 20px;
    border: 1px solid rgba(255,255,255,0.7);
    box-shadow: 0 10px 20px -5px rgba(0,0,0,0.05);
    transition: transform 0.3s ease;
}

.date-tag {
    background: #f8fafc;
    color: var(--accent);
    padding: 6px 14px;
    border-radius: 10px;
    font-size: 0.75rem;
    font-weight: 800;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 15px;
    border: 1px solid #e2e8f0;
}

.archive-card h3 {
    margin: 0 0 12px 0;
    font-size: 1.4rem;
    color: var(--primary);
}

.archive-card p {
    color: var(--text-light);
    line-height: 1.6;
    margin: 0;
}

/* --- Improved Load More Button --- */
#load-more-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--primary);
    color: white;
    border: none;
    padding: 16px 35px;
    border-radius: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
}

#load-more-btn:hover {
    background: #0f172a;
    transform: translateY(-3px);
    box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
}
        .search-container {
    margin: 0 auto 30px;
    max-width: 600px;
    padding: 0 15px;
}

.search-wrapper {
    position: relative;
    display: flex;
    align-items: center;
}

.search-icon {
    position: absolute;
    left: 15px;
    color: var(--text-light);
}

#archiveSearch {
    width: 100%;
    padding: 15px 15px 15px 45px;
    border-radius: 12px;
    border: 2px solid #e2e8f0;
    background: white;
    font-size: 1rem;
    color: var(--primary);
    transition: all 0.3s ease;
    outline: none;
}

#archiveSearch:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
}
        .category-filter {
    display: flex;
    gap: 10px;
    overflow-x: auto; /* Mobile par swipe ho sakega */
    padding: 10px 0 20px;
    scrollbar-width: none;
}

.filter-btn {
    white-space: nowrap;
    background: white;
    border: 2px solid #e2e8f0;
    padding: 8px 18px;
    border-radius: 50px;
    font-size: 0.85rem;
    font-weight: 600;
    color: #64748b;
    cursor: pointer;
    transition: all 0.3s ease;
}

.filter-btn.active {
    background: #3b82f6;
    border-color: #3b82f6;
    color: white;
}
        body.dark-mode {
    background-color: #0f172a !important;
    color: #f1f5f9 !important;
}
body.dark-mode .archive-card, 
body.dark-mode .search-wrapper input {
    background: #1e293b !important;
    color: white !important;
    border-color: #334155 !important;
}
.theme-toggle {
    position: fixed;
    top: 20px;
    right: 70px; /* Search/Back button se door */
    z-index: 1001;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    padding: 8px;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}
    </style>
</head>
<body>

<div class="app-container">
    <header class="archive-header">
        <a href="/index#notices-section" class="back-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            <span>Back to Live Board</span>
        </a>
        <h1>Digital Records <span>Archive</span></h1>
        <p class="subtitle">Official notice history for K.P.S. Kannauj</p>
    </header>
    <div class="category-filter">
    <button class="filter-btn active" onclick="filterByCategory('all')">All Records</button>
    <button class="filter-btn" onclick="filterByCategory('Exam')">Exams</button>
    <button class="filter-btn" onclick="filterByCategory('Holiday')">Holidays</button>
    <button class="filter-btn" onclick="filterByCategory('Fee')">Fee/Rules</button>
    </div>
    <div class="search-container">
    <div class="search-wrapper">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="archiveSearch" placeholder="Search by title (e.g. Exam, Holiday...)" onkeyup="filterArchive()">
    </div>
    </div>
    <main id="archive-feed">
        <div class="loading-state">
            <div class="spinner"></div>
            <p>Fetching records from cloud...</p>
        </div>
    </main>

    <div id="button-container">
        <button id="load-more-btn" onclick="showMoreNotices()">
            <span>Show Older Records</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 13l5 5 5-5M7 6l5 5 5-5"/></svg>
        </button>
    </div>
</div>
<button id="scrollTopBtn" class="scroll-btn" title="Go to top">↑</button>

<script src="features.js"></script>

<script>
   // Sheet configuration aur Cache-buster
const SHEET_ID = '1zkFojjLzFJLXgSR-ajn_BOMsughsjJUmbVBz8MjJPfI'; 
const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&t=${Date.now()}`;

let allArchivedNotices = []; // Saare filtered notices yahan rahenge
let displayedCount = 0;      // Abhi screen par kitne hain
const limit = 5;             // Har baar kitne naye dikhane hain

async function loadArchive() {
    try {
        const response = await fetch(URL);
        const data = await response.text();
        
        // Rows split karna aur header ko slice karna
        const rows = data.split(/\r?\n/).slice(1);
        allArchivedNotices = []; 

        rows.forEach(row => {
            if (!row.trim()) return;
            
            // Status column (Column D) mein 'archive' check karna
            // .toLowerCase() se 'Archived' ya 'archived' dono chalenge
            if (row.toLowerCase().includes('archive')) { 
                const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                allArchivedNotices.push({
                    date: cols[0] ? cols[0].replace(/"/g, "").trim() : "N/A",
                    title: cols[1] ? cols[1].replace(/"/g, "").trim() : "Untitled Notice",
                    desc: cols[2] ? cols[2].replace(/"/g, "").trim() : ""
                });
            }
        });

        // Initial UI clear karna aur pehle batch ko dikhana
        const feed = document.getElementById('archive-feed');
        feed.innerHTML = ''; 
        showMoreNotices(); 

    } catch (e) { 
        console.error("Fetch Error:", e);
        document.getElementById('archive-feed').innerHTML = '<p style="color:red; text-align:center;">Sync Error. Please Refresh.</p>';
    }
}

function showMoreNotices() {
    const feed = document.getElementById('archive-feed');
    const btn = document.getElementById('load-more-btn');
    
    // Agla batch nikalna
    const nextBatch = allArchivedNotices.slice(displayedCount, displayedCount + limit);
    
    nextBatch.forEach(notice => {
        feed.innerHTML += `
            <div class="archive-card">
                <div class="date-tag">
                    <svg style="width:14px;height:14px;margin-right:6px" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                    </svg>
                    RECORDED ON: ${notice.date}
                </div>
                <h3>${notice.title}</h3>
                <p>${notice.desc}</p>
            </div>`;
    });

    displayedCount += limit;

    // Button dikhana ya chhupana
    if (displayedCount < allArchivedNotices.length) {
        btn.style.display = 'inline-block';
    } else {
        btn.style.display = 'none';
    }

    // Agar koi record na mile
    if (allArchivedNotices.length === 0 && displayedCount >= 0) {
        feed.innerHTML = `
            <div style="text-align:center; padding:40px; color:#64748b;">
                <p>No archived records found.</p>
                <small>Make sure you clicked the <b>Blue Tick (✔)</b> in Sheets App.</small>
            </div>`;
    }
}

// Start loading
loadArchive();
    function filterArchive() {
    const input = document.getElementById('archiveSearch').value.toLowerCase();
    const cards = document.getElementsByClassName('archive-card');
    const btn = document.getElementById('button-container');

    // Search karte waqt "Load More" button ko hide karte hain
    btn.style.display = input === "" ? "block" : "none";

    for (let i = 0; i < cards.length; i++) {
        // Hum Title, Description aur Date teeno mein search karenge
        const date = cards[i].getElementsByClassName('date-tag')[0].innerText.toLowerCase();
        const title = cards[i].getElementsByTagName('h3')[0].innerText.toLowerCase();
        const desc = cards[i].getElementsByTagName('p')[0].innerText.toLowerCase();
        
        // Agar input Date, Title ya Description mein se kisi mein bhi mile
        if (title.includes(input) || desc.includes(input) || date.includes(input)) {
            cards[i].style.display = "";
        } else {
            cards[i].style.display = "none";
        }
    }
    }
    function filterByCategory(category) {
    const cards = document.getElementsByClassName('archive-card');
    const buttons = document.getElementsByClassName('filter-btn');

    // Button color change logic
    for (let btn of buttons) {
        btn.classList.remove('active');
        if (btn.innerText.includes(category) || (category === 'all' && btn.innerText.includes('All'))) {
            btn.classList.add('active');
        }
    }

    // Filtering logic
    for (let card of cards) {
        const title = card.getElementsByTagName('h3')[0].innerText;
        const desc = card.getElementsByTagName('p')[0].innerText;
        
        if (category === 'all' || title.includes(category) || desc.includes(category)) {
            card.style.display = "";
        } else {
            card.style.display = "none";
        }
    }
    }
    function toggleTheme() {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
}

// Page load par purani setting check karein
if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark-mode');
}
    // Disable Right-Click
document.addEventListener('contextmenu', event => event.preventDefault());

// Disable Key Shortcuts
document.onkeydown = function(e) {
    if (e.keyCode == 123) return false; // F12
    if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false; // Inspect
    if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false; // Console
    if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false; // View Source
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Kanpur Public School</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f8f9fa;
            color: #002147; /* School Navy Blue */
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 120px;
            margin: 0;
            line-height: 1;
            color: #002147;
            text-shadow: 3px 3px #ffcc00; /* School Gold */
        }
        h2 {
            font-size: 28px;
            margin: 10px 0 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            padding: 15px 35px;
            background-color: #002147;
            color: #ffffff;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,33,71,0.3);
        }
        .btn:hover {
            background-color: #ffcc00;
            color: #002147;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255,204,0,0.4);
        }
        .logo {
            max-width: 150px;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="img/Polish_20260101_145255406.webp" alt="KPS Logo" class="logo">
        
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
        
        <a href="javascript:void(0)" onclick="goBack()" class="btn">Go Back</a>
        <a href="/index" class="btn" style="background:#ffcc00; color:#002147;">Go Home</a>
        <p>You will be automatically redirected to the homepage in <span id="timer">10</span> seconds.</p>
    </div>
    <script>
    // 1. Countdown Logic
    let seconds = 10;
    const timerDisplay = document.getElementById('timer');

    const countdown = setInterval(() => {
        seconds--;
        timerDisplay.textContent = seconds;
        
        if (seconds <= 0) {
            clearInterval(countdown);
            window.location.href = '/index';
        }
    }, 1000);
        // 2. Smart "Go Back" Function
    const goBack = () => {
        // If there's history to go back to, go back; otherwise, go home
        if (document.referrer && document.referrer.includes(window.location.hostname)) {
            window.history.back();
        } else {
            window.location.href = '/index';
        }
    };

    // 3. Debugging (helpful for the developer)
    console.warn("404 Error: User tried to access: " + window.location.pathname);
        // Disable Right-Click
document.addEventListener('contextmenu', event => event.preventDefault());

// Disable Key Shortcuts
document.onkeydown = function(e) {
    if (e.keyCode == 123) return false; // F12
    if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false; // Inspect
    if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false; // Console
    if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false; // View Source
};
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Fee Payment | Kanpur Public School</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --blue: #003366; --gold: #d4aa00; --light-bg: #f0f4f8; --white: #ffffff; }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; transition: all 0.3s ease; }
        body { margin: 0; background: var(--light-bg); color: #333; display: flex; flex-direction: column; min-height: 100vh; }

        nav { background: var(--blue); padding: 15px 5%; border-bottom: 4px solid var(--gold); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .school-name { color: white; font-weight: 700; font-size: 1.2rem; letter-spacing: 1px; }
        .back-btn { color: var(--gold); text-decoration: none; font-size: 14px; font-weight: 600; border: 1.5px solid var(--gold); padding: 5px 15px; border-radius: 8px; }
        .back-btn:hover { background: var(--gold); color: var(--blue); transform: translateY(-2px); }

        .container { width: 95%; max-width: 550px; margin: 40px auto; }
        .payment-card { background: var(--white); border-radius: 20px; padding: 30px; box-shadow: 0 15px 35px rgba(0,51,102,0.1); border-top: 8px solid var(--blue); position: relative; overflow: hidden; }
        .payment-card::before { content: ""; position: absolute; top: 0; right: 0; width: 100px; height: 100px; background: var(--gold); opacity: 0.1; border-radius: 0 0 0 100%; }

        h2 { color: var(--blue); margin-top: 0; font-size: 1.5rem; text-align: center; }
        p.sub-text { text-align: center; font-size: 13px; color: #666; margin-bottom: 25px; }

        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: var(--blue); }
        input, select { width: 100%; padding: 12px 15px; border: 2px solid #e1e8ee; border-radius: 12px; font-size: 15px; outline: none; background: #fcfdfe; }
        input:focus, select:focus { border-color: var(--blue); box-shadow: 0 0 8px rgba(0,51,102,0.1); }
        
        #streamSection { display: none; animation: slideDown 0.4s ease-out; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .amount-box { background: #f8faff; border: 2px solid #e1e8ee; border-radius: 15px; padding: 20px; text-align: center; margin-top: 25px; }
        .amount-box span { font-size: 12px; color: #777; text-transform: uppercase; font-weight: 700; }
        .amount-box div { font-size: 2rem; font-weight: 800; color: var(--blue); margin-top: 5px; }
        #feeBreakup { font-size: 11px; color: #e74c3c; margin-top: 5px; font-weight: 500; }
        
        .pay-now-btn { width: 100%; background: var(--blue); color: var(--gold); border: none; padding: 16px; border-radius: 12px; font-size: 17px; font-weight: 700; cursor: pointer; margin-top: 25px; box-shadow: 0 8px 20px rgba(0,51,102,0.2); }
        .pay-now-btn:hover { background: #002244; transform: scale(1.02); }
        .pay-now-btn:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }
    </style>
</head>
<body>

<nav>
    <div class="school-name">KPS KANNAUJ</div>
    <a href="index.html" class="back-btn">HOME</a>
</nav>

<div class="container">
    <div class="payment-card">
        <h2>Fee Payment Portal</h2>
        <p class="sub-text">Please enter student details as per school records.</p>

        <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="studentName" placeholder="Enter full name" autocomplete="off">
        </div>

        <div class="input-group">
            <label>Serial Number</label>
            <input type="number" id="sNo" placeholder="e.g. 101" autocomplete="off">
        </div>

        <div class="input-group">
            <label>Class</label>
            <select id="classSelect" onchange="handleClassChange()">
                <option value="">-- Select Class --</option>
                <option value="1">Class 1st</option><option value="2">Class 2nd</option>
                <option value="3">Class 3rd</option><option value="4">Class 4th</option>
                <option value="5">Class 5th</option><option value="6">Class 6th</option>
                <option value="7">Class 7th</option><option value="8">Class 8th</option>
                <option value="9">Class 9th</option><option value="10">Class 10th</option>
                <option value="11">Class 11th</option><option value="12">Class 12th</option>
            </select>
        </div>

        <div class="input-group" id="streamSection">
            <label>Stream</label>
            <select id="streamSelect" onchange="updateAmount()">
                <option value="">-- Select Stream --</option>
                <option value="PCM">Science (PCM)</option>
                <option value="PCB">Science (PCB)</option>
                <option value="COMMERCE">Commerce</option>
            </select>
        </div>

        <div class="input-group">
            <label>Installment</label>
            <select id="instSelect" onchange="updateInstallmentChange()">
                <option value="1">1st Installment</option>
                <option value="2">2nd Installment</option>
                <option value="3">3rd Installment</option>
                <option value="4">4th Installment</option>
            </select>
        </div>

        <div class="amount-box">
            <span>Payable Amount</span>
            <div id="displayAmount">₹ 0.00</div>
            <div id="feeBreakup"></div>
        </div>

        <button class="pay-now-btn" onclick="startPayment()">PROCEED TO PAYMENT</button>
    </div>
</div>

window.updateAmount = function() {
    const classVal = document.getElementById('classSelect').value;
    const streamVal = document.getElementById('streamSelect').value;
    const instVal = document.getElementById('instSelect').value;
    const breakupDiv = document.getElementById('feeBreakup');
    const payBtn = document.querySelector('.pay-now-btn');
    
    let base = 0, fine = 0, cbse = 0;

    if (classVal && instVal) {
        base = (classVal === "11" || classVal === "12") ? (feesData[classVal][streamVal] || 0) : feesData[classVal];

        const today = new Date();
        const month = today.getMonth(); // 0-11
        const date = today.getDate();

        // Quarterly Start Months: 3(Apr), 6(Jul), 9(Oct), 0(Jan)
        let startMonth = [3, 6, 9, 0][parseInt(instVal) - 1];
        
        // Calculate Months Difference
        let monthsPassed = month - startMonth;
        if (monthsPassed < 0) monthsPassed += 12;

        // --- 🚫 RE-ADMISSION LOGIC ---
        // Agar 3 mahine ya usse zyada guzar chuke hain (i.e. Quarter khatam)
        if (monthsPassed >= 3) {
            document.getElementById('displayAmount').innerText = "BLOCKED";
            breakupDiv.innerHTML = "<span style='color:red; font-size:14px;'>Contact School for Re-Admission of Your Ward</span>";
            payBtn.innerText = "PAYMENT BLOCKED ❌";
            payBtn.disabled = true;
            return 0; 
        }

        // --- 💰 SLAB FINE LOGIC ---
        if (monthsPassed === 0 && date > 15) fine = 50;
        else if (monthsPassed === 1) fine = (date <= 15) ? 100 : 150;
        else if (monthsPassed === 2) fine = (date <= 15) ? 200 : 250;

        // CBSE Fees
        if ((classVal === "9" || classVal === "11") && (month >= 7 && month <= 9)) cbse = 400;

        // Reset Button if not blocked (and not already paid)
        updatePayButton(); 
    }

    const total = base + fine + cbse;
    if(total > 0) {
        document.getElementById('displayAmount').innerText = "₹ " + total.toLocaleString('en-IN');
        let notes = [];
        if (fine > 0) notes.push(`+ ₹${fine} Fine`);
        if (cbse > 0) notes.push("+ ₹400 CBSE Reg.");
        breakupDiv.innerText = notes.join(" | ");
    }
    return total;
};

const COLLECTION_NAME = "student_data";
const instKeyMap = { "1": "i", "2": "ii", "3": "iii", "4": "iv" };

// --- 2. Corrected updatePayButton ---
window.updatePayButton = async function() {
    const sn = document.getElementById('sNo').value;
    const inst = document.getElementById('instSelect').value;
    const payBtn = document.querySelector('.pay-now-btn');
    if(!sn || !inst) return;

    const displayAmt = document.getElementById('displayAmount').innerText;
    if(displayAmt === "BLOCKED") return;

    try {
        const studentRef = doc(db, COLLECTION_NAME, sn);
        const snap = await getDoc(studentRef);
        
        if (snap.exists()) {
            const fees = snap.data().fees || {};
            const dbKey = instKeyMap[inst];
            
            if (fees[dbKey] === "PAID") {
                payBtn.innerText = "ALREADY PAID ✅";
                payBtn.disabled = true;
                payBtn.style.backgroundColor = "#22c55e";
            } else {
                payBtn.innerText = "PROCEED TO PAYMENT";
                payBtn.disabled = false;
                payBtn.style.backgroundColor = "#003366";
            }
        }
    } catch (err) { console.error("PayButton Error:", err); }
};

// --- 3. Corrected checkFeeStatus ---
window.checkFeeStatus = async function() {
    const sn = document.getElementById('sNo').value;
    const instDropdown = document.getElementById('instSelect');
    if (!sn) return;

    try {
        const studentRef = doc(db, COLLECTION_NAME, sn);
        const snap = await getDoc(studentRef);
        
        if (snap.exists()) {
            const data = snap.data();
            const fees = data.fees || {};
            // Auto-fill student name if available in Firebase
            if(data.info && data.info.name) {
                document.getElementById('studentName').value = data.info.name;
            }

            for (let i = 0; i < instDropdown.options.length; i++) {
                let opt = instDropdown.options[i];
                let dbKey = instKeyMap[opt.value];
                
                if (fees[dbKey] === "PAID") {
                    opt.text = `Installment ${opt.value} - PAID ✅`;
                    opt.style.color = "green";
                } else {
                    opt.text = `${opt.value}${opt.value==1?'st':(opt.value==2?'nd':(opt.value==3?'rd':'th'))} Installment`;
                    opt.style.color = "black";
                }
            }
        }
        updatePayButton();
    } catch (err) { console.error("Status Check Error:", err); }
};
window.startPayment = async function() {
    const name = document.getElementById('studentName').value;
    const sn = document.getElementById('sNo').value;
    const inst = document.getElementById('instSelect').value;
    const className = document.getElementById('classSelect').value;
    const stream = document.getElementById('streamSelect').value; // Stream bhi uthaya
    const finalAmt = updateAmount();

    if (!name || !sn || finalAmt === 0) {
        alert("⚠️ Please enter all details!");
        return;
    }

    const dbKey = instKeyMap[inst];

    var options = {
        "key": "rzp_test_8y6P9L3K2V9xZ8",
        "amount": finalAmt * 100,
        "currency": "INR",
        "name": "Kanpur Public School",
        "description": `Installment ${inst} - ${name}`,
        "handler": async function (response) {
            try {
                const studentRef = doc(db, COLLECTION_NAME, sn);
                
                // 1. Firebase Update
                await setDoc(studentRef, {
                    fees: {
                        [dbKey]: "PAID",
                        [`${dbKey}_date`]: new Date().toLocaleDateString('en-GB'),
                        [`${dbKey}_ref`]: response.razorpay_payment_id
                    }
                }, { merge: true });

                // 2. 🔥 RECEIPT TRIGGER (Ye miss ho raha tha)
                if (typeof window.generateReceipt === "function") {
                    window.generateReceipt({
                        name: name,
                        sn: sn,
                        className: className,
                        stream: stream || 'N/A',
                        inst: inst,
                        amount: finalAmt,
                        txId: response.razorpay_payment_id
                    });
                }

                alert("✅ Payment Successful! Your receipt is downloading...");
                
                // Reload thoda ruk kar karein taaki PDF download start ho jaye
                setTimeout(() => {
                    location.reload();
                }, 2000);

            } catch (error) { 
                console.error(error);
                alert("Database Error! But payment was successful. ID: " + response.razorpay_payment_id); 
            }
        },
        "prefill": { "name": name },
        "theme": { "color": "#003366" }
    };
    new Razorpay(options).open();
};

<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KPS | Command Center v3.0</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --bg: #000000;
            --card: #111111;
            --accent: #d4aa00;
            --text: #ffffff;
            --field: #1a1a1a;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; }

        /* 🔒 Login Panel */
        #loginPanel { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; }
        
        .input-wrapper { position: relative; width: 100%; max-width: 350px; margin-top: 20px; }
        .input-box {
            width: 100%; background: var(--field); border: 1px solid #333;
            padding: 16px; border-radius: 15px; color: white; font-size: 16px; outline: none; text-align: center;
        }

        /* 👁️ Eye Icon Button */
        .eye-toggle {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            cursor: pointer; color: #666; transition: 0.3s;
        }

        .btn-gold { background: var(--accent); color: #000; font-weight: 800; border: none; padding: 16px; border-radius: 15px; width: 100%; max-width: 350px; margin-top: 20px; cursor: pointer; }

        /* 📱 App Interface */
        #adminDashboard { display: none; height: 100vh; flex-direction: column; }
        .app-header { padding: 20px; background: var(--bg); border-bottom: 1px solid #222; font-weight: 800; color: var(--accent); text-align: center; }
        
        .scroll-area { flex: 1; overflow-y: auto; padding: 20px 15px 100px 15px; }

        /* 👤 Student List */
        .student-item {
            background: var(--card); padding: 18px; border-radius: 16px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center; border: 1px solid #222;
        }
        .student-item:active { transform: scale(0.98); background: #1a1a1a; }

        /* 📋 Profile Drawer (Mobile Style) */
        .profile-drawer {
            position: fixed; bottom: -100%; left: 0; width: 100%; height: 90vh;
            background: var(--card); border-radius: 25px 25px 0 0; z-index: 2000;
            transition: bottom 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 25px; overflow-y: auto; border-top: 2px solid var(--accent);
        }
        .profile-drawer.active { bottom: 0; }

        /* 📄 Data Lines (Line-by-Line View) */
        .data-line {
            display: flex; flex-direction: column; padding: 12px 0; border-bottom: 1px solid #222;
        }
        .data-line b { font-size: 10px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
        .data-line span { font-size: 15px; margin-top: 4px; color: #eee; }

        /* 🧭 Bottom Navigation */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; height: 75px;
            background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(15px);
            display: flex; justify-content: space-around; border-top: 1px solid #222;
        }
        .nav-link { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #555; font-size: 10px; text-decoration: none; cursor: pointer; }
        .nav-link.active { color: var(--accent); }
    </style>
</head>
<body>

<div id="loginPanel">
    <img src="https://img.icons8.com/color/96/university.png" style="width:70px; margin-bottom:10px;">
    <h2 style="margin:0; letter-spacing:-1px;">KPS COMMAND</h2>
    <div class="input-wrapper">
        <input type="password" id="passKey" class="input-box" placeholder="Master PIN">
        <span class="eye-toggle" onclick="togglePass()">
            <svg id="eyeSvg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </span>
    </div>
    <button class="btn-gold" onclick="verifyAdmin()">UNLOCK TERMINAL</button>
</div>

<div id="adminDashboard">
    <div class="app-header">KPS STEALTH ADMIN</div>

    <div class="scroll-area">
        <div id="tab-ops">
            <div style="background:var(--card); padding:20px; border-radius:20px; margin-bottom:20px;">
                <h4 style="margin-top:0;">Cloud Controls</h4>
                <button class="btn-gold" id="syncBtn" onclick="performSync()" style="margin-bottom:10px;">🔄 SYNC MARKS</button>
                <button onclick="syncFeesToSheet()" style="width:100%; padding:15px; background:#222; border:none; color:white; border-radius:15px; font-weight:700;">📤 EXPORT FEES</button>
            </div>
        </div>

        <div id="tab-search" style="display:none;">
            <input type="text" id="searchBar" class="input-box" placeholder="Type name or S.No..." onkeyup="searchFilter()" style="text-align:left; margin-bottom:15px;">
            <div id="listContainer"></div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-link active" onclick="switchNav('ops', this)"><span>⚙️ OPS</span></div>
        <div class="nav-link" onclick="switchNav('search', this)"><span>🔍 SEARCH</span></div>
        <div class="nav-link" onclick="location.reload()"><span>🔒 EXIT</span></div>
    </div>
</div>

<div id="drawer" class="profile-drawer">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <span style="font-weight:800; color:var(--accent);">STUDENT PROFILE</span>
        <button onclick="closeDrawer()" style="background:none; border:none; color:white; font-size:20px;">✕</button>
    </div>
    <div id="drawerContent"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
    import { getFirestore, doc, setDoc, getDocs, collection, getDoc } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";

    // Firebase Config (Aapki config paste karein)
    const firebaseConfig = {
        apiKey: "AIzaSyCQ6S-YfO61gEfB2Ad7neDU-nG4WNn1z8E",
        authDomain: "kanpur-public-school-d8f4a.firebaseapp.com",
        projectId: "kanpur-public-school-d8f4a",
        storageBucket: "kanpur-public-school-d8f4a.firebasestorage.app",
        messagingSenderId: "421329321742",
        appId: "1:421329321742:web:0cf01ae45063566bc9215f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const csvUrl = "https://docs.google.com/spreadsheets/d/1ykfR3DTZqifvOzE0SEBHhdS7RVWobkjRXFfYLPM7sdk/export?format=csv";

    // --- UI LOGIC ---
    window.togglePass = () => {
        const p = document.getElementById('passKey');
        const s = document.getElementById('eyeSvg');
        p.type = p.type === "password" ? "text" : "password";
        s.style.color = p.type === "text" ? "var(--accent)" : "#666";
    };

    window.verifyAdmin = () => {
        if(document.getElementById('passKey').value === "KPS@2026") {
            document.getElementById('loginPanel').style.display = 'none';
            document.getElementById('adminDashboard').style.display = 'flex';
        } else { Swal.fire('Error', 'Wrong PIN', 'error'); }
    };

    window.switchNav = (tab, el) => {
        document.getElementById('tab-ops').style.display = tab === 'ops' ? 'block' : 'none';
        document.getElementById('tab-search').style.display = tab === 'search' ? 'block' : 'none';
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        el.classList.add('active');
        if(tab === 'search') fetchStudents();
    };

    // --- CLOUD SYNC ---
    window.performSync = () => {
        const btn = document.getElementById('syncBtn');
        btn.innerText = "⚡ SYNCING...";
        Papa.parse(csvUrl, {
            download: true, header: true,
            complete: async (res) => {
                for(let r of res.data) {
                    const id = r['Serial No'] || r['Serial_No'];
                    if(id) await setDoc(doc(db, "student_data", id.toString()), r, {merge:true});
                }
                Swal.fire('Success', 'Database Updated', 'success');
                btn.innerText = "🔄 SYNC MARKS";
            }
        });
    };

    // --- SEARCH & DRAWER ---
    async function fetchStudents() {
        const cont = document.getElementById('listContainer');
        cont.innerHTML = "<p>Loading...</p>";
        const snap = await getDocs(collection(db, "student_data"));
        cont.innerHTML = "";
        snap.forEach(d => {
            const data = d.data();
            const div = document.createElement('div');
            div.className = 'student-item';
            div.innerHTML = `<span>${data.Name || 'Unknown'}</span> <b>${d.id}</b>`;
            div.onclick = () => openDrawer(d.id);
            cont.appendChild(div);
        });
    }

    window.openDrawer = async (id) => {
        const snap = await getDoc(doc(db, "student_data", id));
        if(snap.exists()) {
            const d = snap.data();
            const draw = document.getElementById('drawer');
            const cont = document.getElementById('drawerContent');
            
            let lines = "";
            for(let key in d) {
                lines += `<div class="data-line"><b>${key}</b><span>${d[key] || 'N/A'}</span></div>`;
            }
            cont.innerHTML = lines;
            draw.classList.add('active');
        }
    };

    window.closeDrawer = () => document.getElementById('drawer').classList.remove('active');
    window.syncFeesToSheet = async () => {
    const feeBtn = document.getElementById('feeSyncBtn'); // Ensure this ID matches your button
    
    // 1. Confirm from Admin
    const result = await Swal.fire({
        title: 'Export to Sheet?',
        text: "This will send all Firebase records to Google Sheets.",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Yes, Export!'
    });

    if (!result.isConfirmed) return;

    Swal.fire({ title: 'Processing...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

    try {
        // 2. Fetch ALL data from Firebase
        const querySnapshot = await getDocs(collection(db, "student_data"));
        let allStudents = [];

        querySnapshot.forEach((doc) => {
            const d = doc.data();
            // Sirf wahi data bhejein jo Sheet mein chahiye
            allStudents.push({
                serial_no: doc.id,
                name: d.Name || d.info?.name || "",
                class: d.Class || d.info?.class || "",
                fees_paid: d.installment_1_status || "Unpaid", // Example field
                last_sync: new Date().toLocaleString()
            });
        });

        // 3. Post to Google Apps Script
        // REPLACE THIS URL with your deployed Apps Script URL
        const webAppURL = "https://script.google.com/macros/s/AKfycbwGki5qIksWm-48Sc7saT9KMn3Vtjdymskl4KblXHhUynyUPVfhO6JYWuvfs43lQ3ziKg/exec";

        const response = await fetch(webAppURL, {
            method: "POST",
            mode: "no-cors", // Crucial for Google Script
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(allStudents)
        });

        Swal.fire('Success', 'Data sent to Google Sheet successfully!', 'success');

    } catch (error) {
        console.error(error);
        Swal.fire('Error', 'Failed to export: ' + error.message, 'error');
    }
};

</script>
</body>
</html>

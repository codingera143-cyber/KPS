<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPS | Advanced Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --primary: #003366;
            --accent: #d4aa00;
            --bg: #f4f7fe;
            --white: #ffffff;
            --success: #27ae60;
            --error: #e74c3c;
        }

        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { 
            margin: 0; 
            background: var(--bg); 
            background-image: radial-gradient(circle at 10% 20%, rgba(0,51,102,0.05) 0%, transparent 20%), 
                              radial-gradient(circle at 90% 80%, rgba(212,170,0,0.05) 0%, transparent 20%);
            display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;
        }

        /* Animations */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Login & Dashboard Container */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 100%;
            max-width: 500px;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.1);
            text-align: center;
            animation: slideUp 0.6s ease-out;
        }

        .logo-area {
            width: 90px; height: 90px; background: var(--primary); color: var(--accent);
            border-radius: 22px; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 25px; font-size: 28px; font-weight: 800;
            transform: rotate(-10deg); box-shadow: 0 10px 20px rgba(0,51,102,0.2);
        }

        h1 { color: var(--primary); font-size: 24px; margin-bottom: 8px; font-weight: 700; }
        p.desc { color: #7f8c8d; font-size: 14px; margin-bottom: 30px; }

        /* Form Elements */
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 12px; font-weight: 600; color: var(--primary); margin-left: 10px; margin-bottom: 5px; text-transform: uppercase; }
        
        input {
            width: 100%; padding: 15px 20px; border-radius: 15px; border: 2px solid #eee;
            font-size: 16px; outline: none; transition: 0.3s; background: #fafafa;
        }
        input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 15px rgba(0,51,102,0.05); }

        /* Buttons */
        .btn {
            width: 100%; padding: 16px; border: none; border-radius: 15px;
            font-size: 16px; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: 0.4s;
        }
        .btn-main { background: var(--primary); color: var(--accent); box-shadow: 0 10px 20px rgba(0,51,102,0.15); }
        .btn-main:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(0,51,102,0.25); background: #002244; }
        .btn-main:active { transform: translateY(-1px); }

        /* Dashboard View */
        #adminDashboard { display: none; }
        
        .sync-info {
            background: #f8f9ff; border: 1px dashed #cbd5e0;
            padding: 15px; border-radius: 15px; margin-bottom: 25px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
        }
        .info-tag { font-size: 11px; color: #666; }
        .info-val { font-size: 13px; font-weight: 600; color: var(--primary); display: block; }

        /* Progress & Status */
        .status-pill {
            margin-top: 20px; padding: 12px; border-radius: 12px; font-size: 13px; font-weight: 600;
            display: none; animation: fadeIn 0.3s;
        }
        .status-success { display: block; background: #dff6e8; color: var(--success); }
        .status-error { display: block; background: #fdeaea; color: var(--error); }

        .logout { margin-top: 25px; font-size: 13px; color: #95a5a6; cursor: pointer; text-decoration: underline; }

        /* Responsive */
        @media (max-width: 480px) {
            .glass-card { padding: 30px 20px; }
            h1 { font-size: 20px; }
        }
    </style>
</head>
<body>

<div id="loginPanel" class="glass-card">
    <div class="logo-area">KPS</div>
    <h1>Admin Login</h1>
    <p class="desc">Enter master password to access school database</p>
    
    <div class="input-group">
        <label>Security Key</label>
        <input type="password" id="passKey" placeholder="••••••••">
    </div>
    
    <button class="btn btn-main" onclick="verifyAdmin()">Unlock Dashboard</button>
</div>

<div id="adminDashboard" class="glass-card">
    <div class="logo-area" style="transform: rotate(0deg); width: 60px; height: 60px; font-size: 18px;">DB</div>
    <h1>Cloud Control</h1>
    <p class="desc">Sync CSV records with Firebase Cloud Store</p>

    <div class="sync-info">
        <div>
            <span class="info-tag">SOURCE</span>
            <span class="info-val">Google Sheet</span>
        </div>
        <div>
            <span class="info-tag">TARGET</span>
            <span class="info-val">Firebase V9</span>
        </div>
    </div>

    <button id="syncActionBtn" class="btn btn-main" onclick="performCloudSync()">
        <span id="btnTxt">🔄 START DATA SYNC</span>
    </button>

    <div id="msgBox" class="status-pill"></div>

    <div class="logout" onclick="location.reload()">Secure Logout</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";

    // 1. TODO: Replace with your actual Firebase Config
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 2. TODO: Replace with your Google Sheet CSV Link
    const csvUrl = "PASTE_YOUR_CSV_LINK_HERE";

    // Authentication Logic
    window.verifyAdmin = function() {
        const pass = document.getElementById('passKey').value;
        if(pass === "KPS@2026") {
            document.getElementById('loginPanel').style.display = "none";
            document.getElementById('adminDashboard').style.display = "block";
        } else {
            alert("❌ Access Denied: Wrong Password");
        }
    }

    // Cloud Sync Logic (Handles all 40+ columns)
    window.performCloudSync = function() {
        const btn = document.getElementById('syncActionBtn');
        const txt = document.getElementById('btnTxt');
        const msg = document.getElementById('msgBox');

        btn.disabled = true;
        txt.innerText = "⚡ WRITING TO CLOUD...";
        msg.style.display = "none";

        Papa.parse(csvUrl, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: async function(results) {
                const rows = results.data;
                let successCount = 0;

                try {
                    for (let r of rows) {
                        if (r['Serial No']) {
                            const studentID = r['Serial No'].toString();
                            
                            // Advanced mapping for your 40+ columns
                            const fullData = {
                                info: {
                                    serial_no: r['Serial No'],
                                    name: r['Name'],
                                    class: r['Class'],
                                    section: r['Section'],
                                    password: r['Password'] || "12345",
                                    image: r['Student Image'],
                                    behavior: r['Behavior'],
                                    advice: r['Advice']
                                },
                                attendance: {
                                    apr: r['Apr_Att'], may: r['May_Att'], jun: r['Jun_Att'], jul: r['Jul_Att'],
                                    aug: r['Aug_Att'], sep: r['Sep_Att'], oct: r['Oct_Att'], nov: r['Nov_Att'],
                                    dec: r['Dec_Att'], jan: r['Jan_Att'], feb: r['Feb_Att'], mar: r['Mar_Att']
                                },
                                academic: {
                                    maths: r['Maths'], science: r['Science'], arts: r['Arts'], comp: r['Computer'],
                                    it: r['IT'], ai: r['AI'], ca: r['CA'], eng: r['English'], hindi: r['Hindi'],
                                    music: r['Music'], physical: r['Health & Physical Education'], yoga: r['Yoga'],
                                    physics: r['Physics'], chem: r['Chemistry'], bio: r['Biology'], bst: r['BST'],
                                    accounts: r['Accounts'], micro: r['Microeconomics'], banking: r['Banking'],
                                    evs: r['EVS'], sanskrit: r['Sanskrit'], gk: r['GK']
                                },
                                fees: {
                                    i: r['Ist Installment'],
                                    ii: r['IInd installment'],
                                    iii: r['IIIrd installment'],
                                    iv: r['IVth installment']
                                },
                                timestamp: new Date()
                            };

                            await setDoc(doc(db, "student_data", studentID), fullData, { merge: true });
                            successCount++;
                        }
                    }
                    msg.className = "status-pill status-success";
                    msg.innerText = `✅ Cloud Sync Complete: ${successCount} Students Updated`;
                } catch (err) {
                    msg.className = "status-pill status-error";
                    msg.innerText = "❌ Sync Failed: " + err.message;
                }

                btn.disabled = false;
                txt.innerText = "🔄 RE-SYNC DATABASE";
            }
        });
    }
</script>

</body>
  </html>

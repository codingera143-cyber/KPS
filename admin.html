<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPS | Advanced Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary: #003366;
            --accent: #d4aa00;
            --bg: #f4f7fe;
            --white: #ffffff;
            --success: #27ae60;
            --error: #e74c3c;
        }

        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; transition: 0.3s; }
        
        body { 
            margin: 0; 
            background: var(--bg); 
            background-image: radial-gradient(circle at 10% 20%, rgba(0,51,102,0.05) 0%, transparent 20%);
            display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            width: 100%; max-width: 500px;
            padding: 40px; border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.1);
            text-align: center;
        }

        .logo-area {
            width: 80px; height: 80px; background: var(--primary); color: var(--accent);
            border-radius: 20px; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px; font-size: 24px; font-weight: 800;
            box-shadow: 0 10px 20px rgba(0,51,102,0.2);
        }

        h1 { color: var(--primary); font-size: 22px; margin-bottom: 5px; }
        p.desc { color: #7f8c8d; font-size: 13px; margin-bottom: 25px; }

        .input-group { text-align: left; margin-bottom: 20px; }
        label { font-size: 11px; font-weight: 700; color: var(--primary); text-transform: uppercase; margin-left: 5px; }
        
        input {
            width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #eee;
            font-size: 16px; outline: none; margin-top: 5px;
        }
        input:focus { border-color: var(--primary); }

        .btn {
            width: 100%; padding: 16px; border: none; border-radius: 12px;
            font-size: 15px; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-main { background: var(--primary); color: var(--accent); }
        .btn-main:hover { transform: translateY(-2px); opacity: 0.9; }

        #adminDashboard { display: none; }
        
        .sync-info {
            background: #f8f9ff; border: 1px dashed #cbd5e0;
            padding: 15px; border-radius: 15px; margin-bottom: 25px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
        }
        .info-tag { font-size: 10px; color: #666; display: block; }
        .info-val { font-size: 12px; font-weight: 600; color: var(--primary); }

        .logout { margin-top: 20px; font-size: 12px; color: #95a5a6; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

<div id="loginPanel" class="glass-card">
    <div class="logo-area">KPS</div>
    <h1>Admin Access</h1>
    <p class="desc">Authentication required for cloud sync</p>
    <div class="input-group">
        <label>Master Password</label>
        <input type="password" id="passKey" placeholder="••••••••">
    </div>
    <button class="btn btn-main" onclick="verifyAdmin()">Login to Dashboard</button>
</div>

<div id="adminDashboard" class="glass-card">
    <div class="logo-area">DB</div>
    <h1>Cloud Controller</h1>
    <p class="desc">Database: kanpur-public-school-d8f4a</p>

    <div class="sync-info">
        <div><span class="info-tag">SOURCE</span><span class="info-val">Google CSV</span></div>
        <div><span class="info-tag">COLLECTION</span><span class="info-val">student_data</span></div>
    </div>

    <button id="syncActionBtn" class="btn btn-main" onclick="performCloudSync()">
        <span id="btnTxt">🔄 START CLOUD SYNC</span>
    </button>

    <div class="logout" onclick="location.reload()">Secure Logout</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCQ6S-YfO61gEfB2Ad7neDU-nG4WNn1z8E",
        authDomain: "kanpur-public-school-d8f4a.firebaseapp.com",
        projectId: "kanpur-public-school-d8f4a",
        storageBucket: "kanpur-public-school-d8f4a.firebasestorage.app",
        messagingSenderId: "421329321742",
        appId: "1:421329321742:web:0cf01ae45063566bc9215f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const csvUrl = "https://docs.google.com/spreadsheets/d/1ykfR3DTZqifvOzE0SEBHhdS7RVWobkjRXFfYLPM7sdk/export?format=csv";

    window.verifyAdmin = function() {
        if(document.getElementById('passKey').value === "KPS@2026") {
            document.getElementById('loginPanel').style.display = "none";
            document.getElementById('adminDashboard').style.display = "block";
        } else {
            Swal.fire('Error', 'Wrong Password!', 'error');
        }
    }

    window.performCloudSync = function() {
        const btn = document.getElementById('syncActionBtn');
        btn.disabled = true;
        document.getElementById('btnTxt').innerText = "⚡ SYNCING...";

        // Initial Loading Popup
        Swal.fire({
            title: 'Processing...',
            text: 'Reading Google Sheet and updating Firebase',
            allowOutsideClick: false,
            didOpen: () => { Swal.showLoading() }
        });

        Papa.parse(csvUrl, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: async function(results) {
                const rows = results.data;
                let count = 0;

                try {
                    for (let r of rows) {
                        const sID = r['Serial No'] || r['Serial_No'];
                        if (sID) {
                            const studentID = sID.toString().trim();
                            const fullData = {
                                info: {
                                    serial_no: studentID,
                                    name: r['Name'] || "",
                                    class: r['Class'] || "",
                                    section: r['Section'] || "",
                                    password: r['Password'] || "12345",
                                    image: r['Student Image'] || "",
                                    behavior: r['Behavior'] || "",
                                    advice: r['Advice'] || ""
                                },
                                attendance: {
                                    apr: r['Apr_Att'], may: r['May_Att'], jul: r['Jul_Att'], aug: r['Aug_Att'],
                                    sep: r['Sep_Att'], oct: r['Oct_Att'], nov: r['Nov_Att'], dec: r['Dec_Att'],
                                    jan: r['Jan_Att'], feb: r['Feb_Att'], mar: r['Mar_Att']
                                },
                                academic: {
                                    maths: r['Maths'], science: r['Science'], arts: r['Arts'], comp: r['Computer'],
                                    it: r['IT'], ai: r['AI'], ca: r['CA'], eng: r['English'], hindi: r['Hindi'],
                                    music: r['Music'], physical: r['Health & Physical Education'], yoga: r['Yoga'],
                                    physics: r['Physics'], chem: r['Chemistry'], bio: r['Biology'], bst: r['BST'],
                                    accounts: r['Accounts'], micro: r['Microeconomics'], banking: r['Banking'],
                                    evs: r['EVS'], sanskrit: r['Sanskrit'], gk: r['GK']
                                },
                                fees: {
                                    i: r['Ist Installment'], ii: r['IInd installment'],
                                    iii: r['IIIrd installment'], iv: r['IVth installment']
                                },
                                last_update: new Date()
                            };
                            await setDoc(doc(db, "student_data", studentID), fullData, { merge: true });
                            count++;
                        }
                    }
                    Swal.fire('Success!', `${count} Students synced successfully.`, 'success');
                } catch (err) {
                    console.error(err);
                    Swal.fire('Sync Failed', err.message, 'error');
                }
                btn.disabled = false;
                document.getElementById('btnTxt').innerText = "🔄 RE-SYNC DATABASE";
            },
            error: function(err) {
                Swal.fire('CSV Error', 'Could not read Google Sheet link.', 'error');
                btn.disabled = false;
                document.getElementById('btnTxt').innerText = "🔄 START DATA SYNC";
            }
        });
    }
</script>
</body>
</html>

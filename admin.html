<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPS | Advanced Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary: #003366;
            --accent: #d4aa00;
            --bg: #f4f7fe;
            --white: #ffffff;
            --success: #27ae60;
            --error: #e74c3c;
        }

        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; transition: 0.3s; }
        
        body { 
            margin: 0; 
            background: var(--bg); 
            display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            width: 100%; max-width: 500px;
            padding: 40px; border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.1);
            text-align: center;
        }

        .logo-area {
            width: 80px; height: 80px; background: var(--primary); color: var(--accent);
            border-radius: 20px; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px; font-size: 24px; font-weight: 800;
        }

        h1 { color: var(--primary); font-size: 22px; margin-bottom: 5px; }
        p.desc { color: #7f8c8d; font-size: 13px; margin-bottom: 25px; }

        .input-group { text-align: left; margin-bottom: 20px; }
        label { font-size: 11px; font-weight: 700; color: var(--primary); text-transform: uppercase; margin-left: 5px; }
        
        input {
            width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #eee;
            font-size: 16px; outline: none; margin-top: 5px;
        }

        .btn {
            width: 100%; padding: 16px; border: none; border-radius: 12px;
            font-size: 14px; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            margin-bottom: 15px;
        }
        .btn-main { background: var(--primary); color: var(--accent); }
        .btn-sync { background: var(--success); color: white; border: 2px solid #2ecc71; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        #adminDashboard { display: none; }
        
        .sync-info {
            background: #f8f9ff; border: 1px dashed #cbd5e0;
            padding: 15px; border-radius: 15px; margin-bottom: 25px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
        }
        .info-tag { font-size: 10px; color: #666; display: block; }
        .info-val { font-size: 12px; font-weight: 600; color: var(--primary); }

        .logout { margin-top: 20px; font-size: 12px; color: #95a5a6; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

<div id="loginPanel" class="glass-card">
    <div class="logo-area">KPS</div>
    <h1>Admin Access</h1>
    <p class="desc">Authentication required for cloud sync</p>
    <div class="input-group">
        <label>Master Password</label>
        <input type="password" id="passKey" placeholder="••••••••">
    </div>
    <button class="btn btn-main" onclick="verifyAdmin()">Login to Dashboard</button>
</div>

<div id="adminDashboard" class="glass-card">
    <div class="logo-area">DB</div>
    <h1>Cloud Controller</h1>
    <p class="desc">Managed by Kanpur Public School</p>

    <div class="sync-info">
        <div><span class="info-tag">STATUS</span><span class="info-val" id="syncStatus">Ready</span></div>
        <div><span class="info-tag">LOGGED IN</span><span class="info-val">Admin Mode</span></div>
    </div>

    <button id="syncActionBtn" class="btn btn-main" onclick="performCloudSync()">
        <span id="btnTxt">🔄 SYNC MARKS TO FIREBASE</span>
    </button>

    <button id="feeSyncBtn" class="btn btn-sync" onclick="syncFeesToGoogleSheet()">
        <span>📤 SYNC FEES TO GOOGLE SHEET</span>
    </button>

    <div class="logout" onclick="location.reload()">Secure Logout</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
    import { getFirestore, doc, setDoc, getDocs, collection } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCQ6S-YfO61gEfB2Ad7neDU-nG4WNn1z8E",
        authDomain: "kanpur-public-school-d8f4a.firebaseapp.com",
        projectId: "kanpur-public-school-d8f4a",
        storageBucket: "kanpur-public-school-d8f4a.firebasestorage.app",
        messagingSenderId: "421329321742",
        appId: "1:421329321742:web:0cf01ae45063566bc9215f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const csvUrl = "https://docs.google.com/spreadsheets/d/1ykfR3DTZqifvOzE0SEBHhdS7RVWobkjRXFfYLPM7sdk/export?format=csv";
    
    // REPLACE THIS with your Apps Script Web App URL
    const webAppURL = "https://script.google.com/macros/s/AKfycbwGki5qIksWm-48Sc7saT9KMn3Vtjdymskl4KblXHhUynyUPVfhO6JYWuvfs43lQ3ziKg/exec";

    window.verifyAdmin = function() {
        if(document.getElementById('passKey').value === "KPS@2026") {
            document.getElementById('loginPanel').style.display = "none";
            document.getElementById('adminDashboard').style.display = "block";
        } else {
            Swal.fire('Error', 'Wrong Password!', 'error');
        }
    }

    // --- LOGIC 1: GOOGLE SHEET (CSV) -> FIREBASE ---
    window.performCloudSync = function() {
        const btn = document.getElementById('syncActionBtn');
        btn.disabled = true;
        document.getElementById('btnTxt').innerText = "⚡ SYNCING MARKS...";

        Papa.parse(csvUrl, {
            download: true, header: true, skipEmptyLines: true,
            complete: async function(results) {
                const rows = results.data;
                let count = 0;
                try {
                    for (let r of rows) {
                        const sID = r['Serial No'] || r['Serial_No'];
                        if (sID) {
                            const studentID = sID.toString().trim();
                            const fullData = {
                                info: {
                                    serial_no: studentID,
                                    name: r['Name'] || "",
                                    class: r['Class'] || "",
                                    section: r['Section'] || "",
                                    stream: r['Stream'] || "",
                                    password: r['Password'] || "12345",
                                    image: r['Student Image'] || "",
                                    behavior: r['Behavior'] || "",
                                    advice: r['Advice'] || ""
                                },
                                academic: {
                                    maths: r['Maths'], science: r['Science'], arts: r['Arts'], comp: r['Computer'],
                                    it: r['IT'], ai: r['AI'], ca: r['CA'], eng: r['English'], hindi: r['Hindi'],
                                    music: r['Music'], physical: r['Health & Physical Education'], yoga: r['Yoga'],
                                    physics: r['Physics'], chem: r['Chemistry'], bio: r['Biology'], bst: r['BST'],
                                    accounts: r['Accounts'], micro: r['Microeconomics'], banking: r['Banking'],
                                    evs: r['EVS'], sanskrit: r['Sanskrit'], gk: r['GK']
                                },
                                last_update: new Date()
                            };
                            // NOTE: Fees data is not updated from CSV to prevent overwriting PAID status
                            await setDoc(doc(db, "student_data", studentID), fullData, { merge: true });
                            count++;
                        }
                    }
                    Swal.fire('Success', `${count} Students records updated!`, 'success');
                } catch (err) {
                    Swal.fire('Error', err.message, 'error');
                }
                btn.disabled = false;
                document.getElementById('btnTxt').innerText = "🔄 SYNC MARKS TO FIREBASE";
            }
        });
    }

    // --- LOGIC 2: FIREBASE -> GOOGLE SHEET (Using Apps Script) ---
    window.syncFeesToGoogleSheet = async function() {
        const feeBtn = document.getElementById('feeSyncBtn');
        feeBtn.disabled = true;
        feeBtn.innerText = "⏳ SENDING TO SHEET...";

        try {
            // fee_records collection se data uthana (Jahan Razorpay update karta hai)
            const querySnapshot = await getDocs(collection(db, "fee_records"));
            let studentData = [];

            querySnapshot.forEach((doc) => {
                const d = doc.data();
                studentData.push({
                    sn: doc.id,
                    name: d.name || "-",
                    class: d.class || "-",
                    section: d.section || "A",
                    stream: d.stream || "N/A",
                    inst1: d.installment_1_status || "Unpaid",
                    inst2: d.installment_2_status || "Unpaid",
                    inst3: d.installment_3_status || "Unpaid",
                    inst4: d.installment_4_status || "Unpaid"
                });
            });

            if(studentData.length === 0) {
                Swal.fire('Notice', 'No fee records found in Firebase!', 'info');
                feeBtn.disabled = false;
                feeBtn.innerText = "📤 SYNC FEES TO GOOGLE SHEET";
                return;
            }

            // POST to Apps Script (Bypass 400 Error)
            fetch(webAppURL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(studentData)
            }).then(() => {
                Swal.fire('Sent!', 'Data sent to Google Sheet successfully.', 'success');
            }).catch(e => {
                Swal.fire('Error', 'Connection failed!', 'error');
            });

        } catch (error) {
            Swal.fire('Firebase Error', error.message, 'error');
        }
        
        feeBtn.disabled = false;
        feeBtn.innerText = "📤 SYNC FEES TO GOOGLE SHEET";
    }
</script>

</body>
</html>

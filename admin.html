<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="googlebot" content="noindex, nofollow">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPS | Stealth Command Center</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary: #001f3f; /* Deep Navy */
            --accent: #d4aa00; /* Gold */
            --bg: #0a0a0a; /* Dark Stealth Mode */
            --glass: rgba(255, 255, 255, 0.05);
            --card-bg: #111111;
        }

        body { 
            margin: 0; background: var(--bg); color: white;
            font-family: 'Poppins', sans-serif; display: flex; 
            align-items: center; justify-content: center; min-height: 100vh;
            overflow-x: hidden;
        }

        /* ✨ Glass Login Card */
        .admin-box {
            background: var(--card-bg); width: 100%; max-width: 450px;
            padding: 40px; border-radius: 25px; border: 1px solid rgba(212, 170, 0, 0.2);
            box-shadow: 0 0 50px rgba(0,0,0,1); text-align: center;
            transition: 0.4s;
        }
        .admin-box:hover { border-color: var(--accent); box-shadow: 0 0 60px rgba(212, 170, 0, 0.1); }

        .school-logo-anim {
            width: 70px; height: 70px; background: var(--accent); color: var(--primary);
            border-radius: 18px; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px; font-weight: 800; font-size: 24px;
            box-shadow: 0 0 20px var(--accent); animation: pulse 2s infinite;
        }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        .input-field { position: relative; margin-bottom: 20px; text-align: left; }
        .input-field label { font-size: 10px; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
        
        input {
            width: 100%; background: #1a1a1a; border: 1px solid #333; padding: 15px;
            color: white; border-radius: 12px; margin-top: 5px; outline: none;
        }
        input:focus { border-color: var(--accent); }

        /* 👁️ Eye Icon */
        .eye-btn {
            position: absolute; right: 15px; top: 38px; cursor: pointer; color: #666;
        }

        .btn {
            width: 100%; padding: 16px; border: none; border-radius: 12px;
            font-weight: 700; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            margin-bottom: 15px;
        }
        .btn-gold { background: var(--accent); color: var(--primary); }
        .btn-gold:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(212, 170, 0, 0.3); }

        /* Dashboard Internal Layout */
        #adminDashboard { display: none; max-width: 900px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin: 20px 0; }
        .stat-item { background: #1a1a1a; padding: 15px; border-radius: 15px; border-bottom: 3px solid var(--accent); }

        /* Tab System */
        .tab-nav { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; background: #222; border-radius: 8px; cursor: pointer; font-size: 12px; border: 1px solid #333; }
        .tab-btn.active { background: var(--accent); color: var(--primary); border: none; }
        .tab-pane { display: none; animation: fadeIn 0.5s; }
        .tab-pane.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .logout-link { color: #555; font-size: 12px; cursor: pointer; margin-top: 20px; }
        .logout-link:hover { color: var(--error); }
    </style>
</head>
<body>

<div id="loginPanel" class="admin-box">
    <div class="school-logo-anim">KPS</div>
    <h1>STAFF ACCESS</h1>
    <p style="color: #666; font-size: 12px;">Authorized Personnel Only</p>
    
    <div class="input-field">
        <label>Passkey</label>
        <input type="password" id="passKey" placeholder="••••••••">
        <span class="eye-btn" onclick="togglePass()">👁️</span>
    </div>
    
    <button class="btn btn-gold" onclick="verifyAdmin()">ACCESS COMMAND CENTER</button>
</div>

<div id="adminDashboard" class="admin-box">
    <div class="tab-nav">
        <div class="tab-btn active" onclick="switchTab('sync')">🔄 Cloud Sync</div>
        <div class="tab-btn" onclick="switchTab('search')">🔍 Search/Edit</div>
        <div class="tab-btn" onclick="switchTab('logs')">📋 Logs</div>
    </div>

    <div id="syncTab" class="tab-pane active">
        <div class="stats-grid">
            <div class="stat-item"><small>Students</small><br><b id="countStudents">-</b></div>
            <div class="stat-item"><small>Last Sync</small><br><b id="lastSyncTime">Never</b></div>
        </div>
        <button class="btn btn-gold" id="syncBtn" onclick="performCloudSync()">⚡ SYNC FROM GOOGLE SHEET</button>
        <button class="btn" style="background:#222; color:white;" onclick="syncFeesToGoogleSheet()">📤 EXPORT FEES TO SHEET</button>
    </div>

    <div id="searchTab" class="tab-pane">
        <div class="input-field">
            <input type="text" id="searchID" placeholder="Enter Serial No..." onkeyup="searchStudentLocally()">
        </div>
        <div id="quickResult" style="text-align: left; font-size: 13px; background: #1a1a1a; padding: 15px; border-radius: 10px; display: none;">
            </div>
    </div>

    <div id="logsTab" class="tab-pane">
        <div id="logContainer" style="font-size: 10px; text-align: left; color: #27ae60; background: black; padding: 15px; height: 150px; overflow-y: auto; border-radius: 10px; font-family: monospace;">
            > Initializing Secure Connection...<br>
            > Waiting for commands...
        </div>
    </div>

    <div class="logout-link" onclick="location.reload()">TERMINATE SESSION (LOGOUT)</div>
</div>

<script type="module">
    // Firebase setup (Same as your config)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, getDocs, collection } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCQ6S-YfO61gEfB2Ad7neDU-nG4WNn1z8E",
        authDomain: "kanpur-public-school-d8f4a.firebaseapp.com",
        projectId: "kanpur-public-school-d8f4a",
        storageBucket: "kanpur-public-school-d8f4a.firebasestorage.app",
        messagingSenderId: "421329321742",
        appId: "1:421329321742:web:0cf01ae45063566bc9215f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const csvUrl = "https://docs.google.com/spreadsheets/d/1ykfR3DTZqifvOzE0SEBHhdS7RVWobkjRXFfYLPM7sdk/export?format=csv";

    // --- HELPER: UI Functions ---
    window.togglePass = () => {
        const p = document.getElementById('passKey');
        p.type = p.type === "password" ? "text" : "password";
    };

    window.switchTab = (tab) => {
        document.querySelectorAll('.tab-btn, .tab-pane').forEach(el => el.classList.remove('active'));
        if(tab === 'sync') { document.getElementById('syncTab').classList.add('active'); event.target.classList.add('active'); }
        if(tab === 'search') { document.getElementById('searchTab').classList.add('active'); event.target.classList.add('active'); }
        if(tab === 'logs') { document.getElementById('logsTab').classList.add('active'); event.target.classList.add('active'); }
    };

    window.addLog = (msg) => {
        const con = document.getElementById('logContainer');
        con.innerHTML += `> ${msg}<br>`;
        con.scrollTop = con.scrollHeight;
    };

    // --- AUTH ---
    window.verifyAdmin = () => {
        if(document.getElementById('passKey').value === "KPS@2026") {
            document.getElementById('loginPanel').style.display = "none";
            document.getElementById('adminDashboard').style.display = "block";
            addLog("Access Granted. Session Started.");
        } else {
            Swal.fire('Restricted', 'Unauthorized Access Attempt!', 'error');
            addLog("ALERT: Wrong Password Attempted!");
        }
    };

    // --- SEARCH STUDENT (No need to go to Firebase) ---
    window.searchStudentLocally = async () => {
        const id = document.getElementById('searchID').value;
        const resBox = document.getElementById('quickResult');
        if(id.length < 2) { resBox.style.display = "none"; return; }

        const docRef = doc(db, "student_data", id);
        const snap = await getDoc(docRef);

        if(snap.exists()) {
            const d = snap.data();
            resBox.style.display = "block";
            resBox.innerHTML = `
                <b style="color:var(--accent)">${d.info.name}</b> (${d.info.class})<br>
                <span>PIN: ${d.info.password}</span> | <span>Status: Active</span><br>
                <div style="margin-top:10px; font-size:11px; color:#888">Details synced from Cloud.</div>
            `;
        } else {
            resBox.style.display = "block";
            resBox.innerHTML = "No student found with this ID.";
        }
    };

    // --- CLOUD SYNC LOGIC ---
    window.performCloudSync = function() {
        const btn = document.getElementById('syncBtn');
        btn.disabled = true;
        addLog("Downloading Google Sheet Data...");

        Papa.parse(csvUrl, {
            download: true, header: true, skipEmptyLines: true,
            complete: async function(results) {
                const rows = results.data;
                addLog(`Parsing ${rows.length} records...`);
                try {
                    for (let r of rows) {
                        const sID = (r['Serial No'] || r['Serial_No'] || "").toString().trim();
                        if (sID) {
                            await setDoc(doc(db, "student_data", sID), {
                                info: { 
                                    serial_no: sID, name: r['Name'], class: r['Class'], 
                                    password: r['Password'] || "12345", image: r['Student Image'] 
                                },
                                academic: { hindi: r['Hindi'], eng: r['English'], maths: r['Maths'] },
                                last_sync: new Date().toLocaleString()
                            }, { merge: true });
                        }
                    }
                    addLog("SYNC SUCCESSFUL.");
                    document.getElementById('lastSyncTime').innerText = new Date().toLocaleTimeString();
                    Swal.fire('Success', 'Cloud Database Updated!', 'success');
                } catch (e) { addLog("ERROR: " + e.message); }
                btn.disabled = false;
            }
        });
    };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPS | Command Center v2.0</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary: #001f3f;
            --accent: #d4aa00;
            --bg: #050505;
            --card: #111111;
            --text: #e2e8f0;
        }

        body { 
            margin: 0; background: var(--bg); color: var(--text);
            font-family: 'Poppins', sans-serif; display: flex; 
            align-items: center; justify-content: center; min-height: 100vh; padding: 15px;
        }

        /* 🔒 Login Styling */
        .glass-login {
            background: var(--card); width: 100%; max-width: 400px;
            padding: 40px; border-radius: 28px; border: 1px solid rgba(212, 170, 0, 0.2);
            text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .logo-img { width: 80px; filter: drop-shadow(0 0 10px var(--accent)); margin-bottom: 15px; }

        .input-group { position: relative; margin-top: 20px; text-align: left; }
        input {
            width: 100%; background: #1a1a1a; border: 1px solid #333; padding: 14px;
            color: white; border-radius: 12px; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(212, 170, 0, 0.2); }

        /* 👁️ Enhanced Eye Animation */
        .eye-box {
            position: absolute; right: 15px; top: 15px; cursor: pointer;
            transition: transform 0.2s;
        }
        .eye-box:active { transform: scale(0.8); }

        .btn {
            width: 100%; padding: 15px; border: none; border-radius: 12px;
            font-weight: 800; cursor: pointer; margin-top: 20px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn-gold { background: var(--accent); color: var(--primary); }
        .btn-gold:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(212, 170, 0, 0.3); }

        /* 🛰️ Dashboard Layout */
        #adminDashboard { display: none; width: 100%; max-width: 1000px; animation: slideUp 0.5s ease; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .dashboard-grid { display: grid; grid-template-columns: 250px 1fr; gap: 20px; }
        @media (max-width: 850px) { .dashboard-grid { grid-template-columns: 1fr; } }

        .sidebar { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid #222; }
        .nav-item { 
            padding: 12px; margin-bottom: 10px; cursor: pointer; border-radius: 10px; 
            font-size: 14px; transition: 0.3s; border-left: 0 solid var(--accent);
        }
        .nav-item:hover, .nav-item.active { background: #1a1a1a; border-left: 4px solid var(--accent); color: var(--accent); }

        .main-panel { background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid #222; position: relative; }

        /* 🔍 Search Results */
        .search-results { margin-top: 20px; display: grid; gap: 10px; max-height: 400px; overflow-y: auto; }
        .student-tile {
            background: #1a1a1a; padding: 15px; border-radius: 12px; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center; border: 1px solid transparent;
        }
        .student-tile:hover { border-color: var(--accent); background: #222; }

        /* 📋 Detail Modal (Pure CSS/JS) */
        .detail-view {
            background: #000; border: 1px solid var(--accent); padding: 20px; border-radius: 15px;
            margin-top: 20px; display: none; animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px; margin-top: 15px; }
        .data-item { background: #111; padding: 8px; border-radius: 5px; border-left: 2px solid var(--accent); }
    </style>
</head>
<body>

<div id="loginPanel" class="glass-login">
    <img src="https://img.icons8.com/color/96/university.png" class="logo-img" alt="Logo">
    <h2 style="margin:0; color:var(--accent);">KPS COMMAND</h2>
    <p style="font-size:12px; color:#666;">Secured Terminal v2.0</p>
    
    <div class="input-group">
        <input type="password" id="passKey" placeholder="Enter Admin Secret PIN">
        <div class="eye-box" onclick="togglePass()">
            <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </div>
    </div>
    <button class="btn btn-gold" onclick="verifyAdmin()">IDENTITY VERIFIED & ENTER</button>
</div>

<div id="adminDashboard">
    <div class="dashboard-grid">
        <div class="sidebar">
            <h3 style="color:var(--accent); margin-top:0;">Menu</h3>
            <div class="nav-item active" onclick="showTab('sync')">⚡ Cloud Sync</div>
            <div class="nav-item" onclick="showTab('search')">🔍 Student Search</div>
            <div class="nav-item" style="color:#e74c3c" onclick="location.reload()">🔒 Secure Exit</div>
        </div>

        <div class="main-panel">
            <div id="tab-sync">
                <h3>Global Cloud Sync</h3>
                <p style="font-size:12px; color:#888;">Sync Google Sheet marks & data to Firebase Database.</p>
                <button class="btn btn-gold" id="syncBtn" onclick="performSync()">START SYNC PROCESS</button>
            </div>

            <div id="tab-search" style="display:none;">
                <h3>Student Intelligence</h3>
                <input type="text" id="searchInput" placeholder="Search by Name or S.No..." onkeyup="filterStudents()">
                
                <div id="studentList" class="search-results">
                    </div>

                <div id="studentDetail" class="detail-view">
                    <button onclick="this.parentElement.style.display='none'" style="float:right; background:none; color:red; border:none; cursor:pointer;">CLOSE ✖</button>
                    <h3 id="det-name" style="color:var(--accent); margin:0;">-</h3>
                    <p id="det-id" style="font-size:12px; color:#888;">ID: -</p>
                    <div class="data-grid" id="det-grid">
                        </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
    import { getFirestore, doc, setDoc, getDocs, collection, getDoc } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCQ6S-YfO61gEfB2Ad7neDU-nG4WNn1z8E",
        authDomain: "kanpur-public-school-d8f4a.firebaseapp.com",
        projectId: "kanpur-public-school-d8f4a",
        storageBucket: "kanpur-public-school-d8f4a.firebasestorage.app",
        messagingSenderId: "421329321742",
        appId: "1:421329321742:web:0cf01ae45063566bc9215f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const csvUrl = "https://docs.google.com/spreadsheets/d/1ykfR3DTZqifvOzE0SEBHhdS7RVWobkjRXFfYLPM7sdk/export?format=csv";

    // 👁️ Eye Toggle Animation
    window.togglePass = () => {
        const p = document.getElementById('passKey');
        const s = document.getElementById('eyeIcon');
        if(p.type === "password") {
            p.type = "text"; s.style.stroke = "var(--accent)";
        } else {
            p.type = "password"; s.style.stroke = "#666";
        }
    };

    // 🔑 Auth
    window.verifyAdmin = () => {
        if(document.getElementById('passKey').value === "KPS@2026") {
            Swal.fire({ title: 'Access Granted', icon: 'success', toast: true, position: 'top-end', showConfirmButton: false, timer: 2000 });
            document.getElementById('loginPanel').style.display = 'none';
            document.getElementById('adminDashboard').style.display = 'block';
        } else {
            Swal.fire('Identity Failed', 'Incorrect PIN!', 'error');
        }
    };

    // 📑 Tab Switcher
    window.showTab = (t) => {
        document.getElementById('tab-sync').style.display = t === 'sync' ? 'block' : 'none';
        document.getElementById('tab-search').style.display = t === 'search' ? 'block' : 'none';
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        event.target.classList.add('active');
        if(t === 'search') loadStudentTiles();
    };

    // ⚡ Sync Logic with Popups
    window.performSync = () => {
        const btn = document.getElementById('syncBtn');
        btn.innerText = "⚡ SYNCING..."; btn.disabled = true;

        Papa.parse(csvUrl, {
            download: true, header: true,
            complete: async (results) => {
                try {
                    for(let r of results.data) {
                        const id = r['Serial No'] || r['Serial_No'];
                        if(id) {
                            await setDoc(doc(db, "student_data", id.toString()), {
                                ...r, lastSync: new Date().toLocaleString()
                            }, { merge: true });
                        }
                    }
                    Swal.fire('Success', 'Cloud Database Updated!', 'success');
                } catch(e) { Swal.fire('Error', 'Sync Failed!', 'error'); }
                btn.innerText = "START SYNC PROCESS"; btn.disabled = false;
            }
        });
    };

    // 🔍 Dynamic Search Tiles
    async function loadStudentTiles() {
        const list = document.getElementById('studentList');
        list.innerHTML = "Loading Students...";
        const snap = await getDocs(collection(db, "student_data"));
        list.innerHTML = "";
        snap.forEach(doc => {
            const d = doc.data();
            const div = document.createElement('div');
            div.className = "student-tile";
            div.innerHTML = `<span><b>${d.Name || d.info?.name}</b></span> <small style="color:var(--accent)">S.No: ${doc.id}</small>`;
            div.onclick = () => showStudentFullDetail(doc.id);
            list.appendChild(div);
        });
    }

    // 📋 Full Detail Viewer (A-Z)
    window.showStudentFullDetail = async (id) => {
        const snap = await getDoc(doc(db, "student_data", id));
        if(snap.exists()) {
            const d = snap.data();
            document.getElementById('studentDetail').style.display = 'block';
            document.getElementById('det-name').innerText = d.Name || d.info?.name;
            document.getElementById('det-id').innerText = "Database ID: " + id;
            
            let html = "";
            for(let key in d) {
                if(typeof d[key] === 'object') {
                    for(let subKey in d[key]) html += `<div class="data-item"><b>${subKey}:</b> ${d[key][subKey]}</div>`;
                } else {
                    html += `<div class="data-item"><b>${key}:</b> ${d[key]}</div>`;
                }
            }
            document.getElementById('det-grid').innerHTML = html;
            window.scrollTo(0, document.body.scrollHeight);
        }
    };
</script>
</body>
</html>

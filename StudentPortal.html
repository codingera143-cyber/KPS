<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KPS | DIGITAL REPORT CARD</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root { 
            --primary: #002d5b; --secondary: #004a99; --accent: #ffd700; 
            --bg: #f3f6f9; --text: #2d3748; --success: #22c55e;
        }
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; transition: all 0.2s ease; }
        body { background: var(--bg); color: var(--text); margin: 0; }
        
        /* Logo Styling */
        .school-logo { width: 60px; height: 60px; background: white; border-radius: 50%; padding: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 10px; }

        .ticker-wrap { background: var(--primary); color: var(--accent); padding: 10px; font-weight: 800; font-size: 11px; text-align: center; border-bottom: 3px solid var(--accent); }
        .container { width: 100%; max-width: 500px; margin: 0 auto; padding: 20px; }

        /* Login UI */
        .auth-card { background: white; padding: 30px; border-radius: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); margin-top: 20px; }
        .input-group { position: relative; margin-bottom: 15px; }
        input { width: 100%; padding: 16px; border-radius: 15px; border: 2px solid #e2e8f0; font-size: 16px; outline: none; }
        .eye-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 20px; color: var(--primary); z-index: 10; }

        .btn { width: 100%; padding: 16px; border-radius: 15px; border: none; font-weight: 800; cursor: pointer; font-size: 16px; background: var(--primary); color: white; }
        .btn:hover { background: var(--secondary); transform: translateY(-2px); }

        /* Report Card */
        #dashboard { display: none; }
        .report-card { background: white; border-radius: 35px; padding: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
        
        .profile-section { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
        .stu-photo { width: 80px; height: 80px; border-radius: 20px; border: 3px solid var(--accent); object-fit: cover; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 800; overflow: hidden; }

        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 25px; }
        .stat-box { background: #f8fafc; padding: 10px 5px; border-radius: 15px; text-align: center; border: 1px solid #edf2f7; }
        .stat-box small { font-size: 8px; color: #a0aec0; font-weight: 800; display: block; }
        .stat-box b { font-size: 14px; color: var(--primary); }

        .subject-item { margin-bottom: 15px; }
        .sub-header { display: flex; justify-content: space-between; font-weight: 800; font-size: 12px; margin-bottom: 5px; }
        .best-tag { font-size: 8px; color: var(--success); background: #e8f5e9; padding: 2px 5px; border-radius: 4px; }
        .p-bar-bg { background: #edf2f7; height: 10px; border-radius: 10px; overflow: hidden; }
        .p-bar-fill { height: 100%; transition: width 1.5s ease; }

        .remarks-alert { background: #fffbeb; border-left: 4px solid var(--accent); padding: 12px; border-radius: 10px; font-size: 12px; font-weight: 700; margin: 20px 0; color: #92400e; }

        .footer-signs { display: grid; grid-template-columns: 1fr 1fr 80px; align-items: flex-end; gap: 10px; margin-top: 30px; padding-top: 20px; border-top: 2px dashed #eee; }
        .sign-text { border-top: 1px solid #ddd; padding-top: 5px; font-size: 9px; font-weight: 800; text-align: center; color: var(--primary); }

        footer { text-align: center; padding: 30px; font-size: 10px; color: #a0aec0; font-weight: 700; }

        @media print { .btn, .ticker-wrap, .eye-icon, footer { display: none !important; } }
    </style>
</head>
<body>

    <div class="ticker-wrap"><marquee>OFFICIAL DIGITAL PROGRESS REPORT • SESSION 2025–26 • KANPUR PUBLIC SCHOOL</marquee></div>

    <div class="container">
        <div id="login-section" style="text-align: center;">
            <img src="https://img.icons8.com/fluency/96/school.png" class="school-logo" alt="Logo">
            <h1 style="color:var(--primary); margin: 0; font-size: 35px;">KPS PORTAL</h1>
            <div class="auth-card">
                <div class="input-group">
                    <input type="text" id="stu_user" placeholder="Serial No.">
                </div>
                <div class="input-group">
                    <input type="password" id="stu_pass" placeholder="Security PIN">
                    <span class="eye-icon" id="togglePass">👁️</span>
                </div>
                <button class="btn" id="loginBtn">Unlock Marksheet 🔒</button>
            </div>
        </div>

        <div id="dashboard">
            <div class="report-card">
                <div style="text-align: center; margin-bottom: 20px;">
                    <img src="https://img.icons8.com/fluency/96/school.png" style="width: 45px;" alt="Logo">
                    <div style="font-size: 10px; font-weight: 800; color: #a0aec0;" id="report-id">ID: -</div>
                </div>

                <div class="profile-section">
                    <div id="stu-img-box" class="stu-photo">?</div>
                    <div>
                        <h2 id="name-txt" style="margin:0; font-size:22px; color:var(--primary);">Name</h2>
                        <p id="class-txt" style="margin:0; font-size:12px; font-weight:700; color:#718096;">Class: -</p>
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat-box"><small>Percent</small><b id="v-perc">0%</b></div>
                    <div class="stat-box"><small>Grade</small><b id="v-grade">-</b></div>
                    <div class="stat-box"><small>Attnd.</small><b id="v-att">0%</b></div>
                    <div class="stat-box"><small>Status</small><b id="v-res">-</b></div>
                </div>

                <div id="subjects-container"></div>

                <div class="remarks-alert">
                    📝 REMARKS: <span id="v-remarks">Good effort!</span>
                </div>

                <div style="height: 150px; margin: 25px 0;">
                    <canvas id="attChart"></canvas>
                </div>

                <div class="footer-signs">
                    <div class="sign-text">CLASS TEACHER</div>
                    <div class="sign-text">PRINCIPAL</div>
                    <div id="qrcode-box"></div>
                </div>
            </div>

            <button class="btn" style="margin-top:20px;" onclick="window.print()">Print Marksheet 🖨️</button>
            <button class="btn" style="margin-top:10px; background:#e2e8f0; color:#4a5568;" onclick="location.reload()">Log Out</button>
        </div>
    </div>

    <footer>© 2026 Kanpur Public School • Digitally Verified</footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCQ6S-YfO61gEfB2Ad7neDU-nG4WNn1z8E",
            authDomain: "kanpur-public-school-d8f4a.firebaseapp.com",
            projectId: "kanpur-public-school-d8f4a",
            storageBucket: "kanpur-public-school-d8f4a.firebasestorage.app",
            messagingSenderId: "421329321742",
            appId: "1:421329321742:web:0cf01ae45063566bc9215f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Toggle Password
        document.getElementById('togglePass').addEventListener('click', () => {
            const p = document.getElementById('stu_pass');
            p.type = p.type === 'password' ? 'text' : 'password';
        });

        document.getElementById('loginBtn').addEventListener('click', async () => {
            const u = document.getElementById('stu_user').value.trim();
            const p = document.getElementById('stu_pass').value.trim();
            if(!u || !p) return;

            const snap = await getDoc(doc(db, "student_data", u));
            if(snap.exists() && snap.data().info.password == p) {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                showMarksheet(snap.data());
            } else { Swal.fire('Error', 'Invalid Serial/PIN', 'error'); }
        });

        function showMarksheet(data) {
            const { info, academic, attendance } = data;
            
            document.getElementById('report-id').innerText = "STUDENT ID: KPS-2026-" + info.serial_no;
            document.getElementById('name-txt').innerText = info.name;
            document.getElementById('class-txt').innerText = `Class: ${info.class} | Section: ${info.section || 'A'}`;
            
            if(info.image) document.getElementById('stu-img-box').innerHTML = `<img src="${info.image}" style="width:100%; height:100%; object-fit:cover;">`;
            else document.getElementById('stu-img-box').innerText = info.name.charAt(0);

            // Subject Finder (Ultra Deep)
            const subList = [];
            let englishMark = 0;
            
            // Loop through academic object and ignore non-subject keys
            Object.entries(academic || {}).forEach(([key, val]) => {
                if(key.toLowerCase() === 'password' || isNaN(val) || val === "") return;
                
                let score = parseInt(val);
                if(key.toLowerCase().includes('english')) englishMark = score;
                else subList.push({ name: key, score: score });
            });

            // Best of 4 calculation
            subList.sort((a,b) => b.score - a.score);
            const topFour = subList.slice(0, 4);
            const topFourNames = topFour.map(s => s.name);
            const total = englishMark + topFour.reduce((a,b) => a + b.score, 0);
            const perc = (total / 5).toFixed(1);

            // Display
            const container = document.getElementById('subjects-container');
            container.innerHTML = '';
            
            const render = (n, s, inc) => {
                const color = s >= 75 ? '#22c55e' : (s >= 33 ? '#3182ce' : '#ef4444');
                container.innerHTML += `
                    <div class="subject-item">
                        <div class="sub-header">
                            <span>${n.toUpperCase()} ${inc ? '<span class="best-tag">Included</span>' : ''}</span>
                            <span>${s}/100</span>
                        </div>
                        <div class="p-bar-bg"><div class="p-bar-fill" style="width:${s}%; background:${color}"></div></div>
                    </div>`;
            };

            render('English', englishMark, true);
            subList.forEach(s => render(s.name, s.score, topFourNames.includes(s.name)));

            // Stats Update
            document.getElementById('v-perc').innerText = perc + "%";
            document.getElementById('v-res').innerText = perc >= 33 ? "PASS" : "FAIL";
            document.getElementById('v-res').style.color = perc >= 33 ? "#22c55e" : "#ef4444";

            let g = "D", rem = "Needs focus";
            if(perc >= 91) { g="A1"; rem="Excellent! Your hard work is visible."; }
            else if(perc >= 81) { g="A2"; rem="Great job! Keep up the momentum."; }
            else if(perc >= 71) { g="B1"; rem="Good performance! Aim higher next time."; }
            document.getElementById('v-grade').innerText = g;
            document.getElementById('v-remarks').innerText = rem;

            // Attendance Chart with Tooltips
            const mths = ['apr','may','jul','aug','sep','oct','nov','dec','jan','feb','mar'];
            const fullNames = ['April','May','July','August','September','October','November','December','January','February','March'];
            const scs = mths.map(m => parseInt(attendance[m]) || 0);
            
            document.getElementById('v-att').innerText = Math.round(scs.reduce((a,b)=>a+b,0)/11) + "%";

            new Chart(document.getElementById('attChart'), {
                type: 'bar',
                data: {
                    labels: fullNames,
                    datasets: [{ label: 'Attendance %', data: scs, backgroundColor: '#004a99', borderRadius: 5 }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: (ctx) => `Attendance: ${ctx.raw}%`
                            }
                        }
                    },
                    scales: { y: { beginAtZero: true, max: 100 } }
                }
            });

            document.getElementById('qrcode-box').innerHTML = "";
            new QRCode(document.getElementById("qrcode-box"), { text: "KPS-"+info.serial_no, width: 60, height: 60 });
        }
    </script>
</body>
</html>

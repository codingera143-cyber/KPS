<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STUDENT PORTAL | KPS SCHOOL</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { 
            --p: #003366; --accent: #d4aa00; --bg: #f8faff; --card: #ffffff; 
            --t: #0f172a; --s: #64748b; --success: #10b981; --danger: #ef4444;
        }
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; transition: 0.3s; }
        body { background: var(--bg); color: var(--t); margin: 0; padding: 0; }

        /* Premium Header */
        .ticker-wrap { background: var(--p); color: var(--accent); padding: 12px 0; font-size: 11px; font-weight: 800; position: sticky; top: 0; z-index: 100; text-align: center; border-bottom: 2px solid var(--accent); letter-spacing: 1px; }
        
        .container { width: 95%; max-width: 500px; margin: 0 auto; padding: 15px; }

        /* Login Upgrade */
        .auth-card { background: var(--card); padding: 40px 30px; border-radius: 30px; box-shadow: 0 25px 50px rgba(0,51,102,0.1); border: 1px solid rgba(212, 170, 0, 0.1); }
        .input-group { position: relative; margin-top: 15px; }
        input { width: 100%; padding: 18px; border-radius: 15px; border: 2px solid #e2e8f0; outline: none; font-size: 16px; background: #fcfdfe; }
        input:focus { border-color: var(--p); box-shadow: 0 0 0 4px rgba(0,51,102,0.05); }
        
        .btn { width: 100%; padding: 18px; border-radius: 18px; border: none; font-weight: 800; cursor: pointer; margin-top: 15px; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-p { background: var(--p); color: var(--accent); box-shadow: 0 10px 20px rgba(0,51,102,0.2); text-transform: uppercase; }
        
        /* Dashboard Styling */
        #dashboard { display: none; animation: slideUp 0.5s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .report-paper { background: white; padding: 30px; border-radius: 30px; position: relative; overflow: hidden; box-shadow: 0 15px 45px rgba(0,0,0,0.05); border: 1px solid #eee; }
        
        .status-badge { position: absolute; top: 25px; right: -45px; transform: rotate(45deg); padding: 8px 50px; font-size: 12px; font-weight: 900; z-index: 10; letter-spacing: 1px; box-shadow: 0 5px 10px rgba(0,0,0,0.1); }
        
        .stu-img-container { width: 90px; height: 90px; border-radius: 25px; background: #f0f4f8; border: 3px solid var(--accent); overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 35px; color: var(--p); font-weight: 800; }
        .stu-img-container img { width: 100%; height: 100%; object-fit: cover; }

        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 25px 0; }
        .stat-item { background: #f8faff; padding: 15px 5px; border-radius: 20px; text-align: center; border: 1px solid #eef2f7; }
        .stat-item small { color: var(--s); font-size: 10px; font-weight: 700; text-transform: uppercase; }
        .stat-item b { color: var(--p); font-size: 18px; }

        .sub-row { margin-bottom: 18px; }
        .sub-info { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; margin-bottom: 6px; }
        .bar-bg { background: #edf2f7; height: 10px; border-radius: 10px; }
        .bar-fill { height: 100%; border-radius: 10px; transition: width 1s ease-in-out; }

        .chart-container { background: #fff; padding: 15px; border-radius: 20px; border: 1px solid #f1f5f9; margin: 25px 0; height: 200px; }

        @media print {
            .no-print, .ticker-wrap, .btn { display: none !important; }
            body { background: white; }
            .report-paper { box-shadow: none; border: none; padding: 0; }
        }
    </style>
</head>
<body>

    <div class="ticker-wrap"><marquee>🏅 OFFICIAL STUDENT PORTAL | SESSION 2025-26 | KPS SCHOOL | DASHBOARD ACCESS 🔒</marquee></div>

    <div class="container">
        <div id="login-section">
            <h1 style="text-align:center; font-size: 42px; font-weight: 900; color: var(--p); margin: 30px 0;">KPS<span style="color:var(--accent)">Portal</span></h1>
            <div class="auth-card">
                <div class="input-group"><input type="text" id="stu_user" placeholder="Enter Serial Number"></div>
                <div class="input-group"><input type="password" id="stu_pass" placeholder="Security PIN"></div>
                <button class="btn btn-p" id="loginBtn" onclick="loginCheck()">Verify & Access</button>
            </div>
            <p style="text-align:center; font-size: 12px; color: var(--s); margin-top: 25px;">Data is encrypted via <b>Google Cloud Security</b></p>
        </div>

        <div id="dashboard">
            <div class="report-paper">
                <div id="res-badge" class="status-badge">PASSED</div>
                
                <div style="display:flex; align-items:center; gap:20px; margin-bottom:25px;">
                    <div id="img-container" class="stu-img-container">?</div>
                    <div>
                        <h2 id="name-display" style="margin:0; font-size:26px; font-weight:800; color:var(--p);"></h2>
                        <span id="meta-display" style="font-size:12px; font-weight:700; color:var(--accent); text-transform:uppercase;"></span>
                    </div>
                </div>

                <div class="stat-grid">
                    <div class="stat-item"><small>Attendance</small><br><b id="att-val">0%</b></div>
                    <div class="stat-item"><small>Grade</small><br><b id="grade-val">-</b></div>
                    <div class="stat-item"><small>Result</small><br><b id="rank-val">0%</b></div>
                </div>

                <h4 style="font-size:14px; color:var(--p); border-left:4px solid var(--accent); padding-left:10px;">ACADEMIC PERFORMANCE</h4>
                <div id="marks-grid"></div>

                <div class="chart-container">
                    <canvas id="growthChart"></canvas>
                </div>

                <div style="background:#f8faff; padding:15px; border-radius:15px; border:1px solid #eef2f7; font-size:11px; line-height:1.6;">
                    <b style="color:var(--p)">TEACHER'S ADVICE:</b> <span id="remark-text"></span><br>
                    <b style="color:var(--p)">BEHAVIOR:</b> <span id="behavior-text"></span>
                </div>

                <div style="display:flex; justify-content:space-between; margin-top:30px; align-items:flex-end;">
                    <div style="text-align:center; flex:1;">
                        <img src="Signs/Principal.png" style="width:80px; height:40px; object-fit:contain;"><br>
                        <span style="font-size:10px; font-weight:800; border-top:1px solid #ddd; display:block; padding-top:5px;">Principal</span>
                    </div>
                    <div id="qrcode"></div>
                </div>
            </div>

            <button class="btn btn-p" onclick="window.print()">Download Marksheet 📄</button>
            <button class="btn" style="background:#f1f5f9; color:var(--p);" onclick="location.href='FeesPayment.html'">Pay Fees Online 💰</button>
            <button class="btn" style="background:transparent; color:var(--s);" onclick="location.reload()">Secure Sign Out</button>
        </div>
    </div>

    <script type="module">
        // FIREBASE INTEGRATION
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            projectId: "YOUR_PROJECT_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.loginCheck = async function() {
            const u = document.getElementById('stu_user').value.trim();
            const p = document.getElementById('stu_pass').value.trim();
            const btn = document.getElementById('loginBtn');

            if(!u || !p) return alert("Please fill all fields");
            
            btn.innerText = "Authenticating...";
            btn.disabled = true;

            try {
                const docRef = doc(db, "student_data", u);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const s = docSnap.data();
                    // Firebase mein info.password check kar rahe hain
                    if (s.info.password.toString() === p) {
                        loadPortal(s);
                    } else {
                        alert("Invalid Security PIN!");
                        resetBtn();
                    }
                } else {
                    alert("Student Record Not Found!");
                    resetBtn();
                }
            } catch (e) {
                alert("Connection Error!");
                resetBtn();
            }
        }

        function resetBtn() {
            const btn = document.getElementById('loginBtn');
            btn.innerText = "Verify & Access";
            btn.disabled = false;
        }

        function loadPortal(s) {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            
            // Basic Info
            document.getElementById('name-display').innerText = s.info.name;
            document.getElementById('meta-display').innerText = `Class: ${s.info.class} | Section: ${s.info.section}`;
            document.getElementById('remark-text').innerText = s.info.advice || "Excellent Progress!";
            document.getElementById('behavior-text').innerText = s.info.behavior || "Good";

            // Profile Image
            const imgBox = document.getElementById('img-container');
            if(s.info.image) imgBox.innerHTML = `<img src="${s.info.image}">`;
            else imgBox.innerText = s.info.name[0];

            // QR Code
            new QRCode(document.getElementById("qrcode"), { text: "ID:"+s.info.serial_no, width: 60, height: 60 });

            // Marks Logic (Filtering only subjects with marks)
            const grid = document.getElementById('marks-grid');
            grid.innerHTML = '';
            let total = 0, count = 0;

            for (const [sub, val] of Object.entries(s.academic)) {
                if (val && val !== "" && val !== "N/A" && !isNaN(val)) {
                    const score = parseInt(val);
                    total += score;
                    count++;
                    grid.innerHTML += `
                        <div class="sub-row">
                            <div class="sub-info">
                                <span>${sub.toUpperCase()}</span>
                                <span>${score}%</span>
                            </div>
                            <div class="bar-bg">
                                <div class="bar-fill" style="width:${score}%; background:${score < 33 ? 'var(--danger)' : 'var(--p)'}"></div>
                            </div>
                        </div>`;
                }
            }

            const avg = count > 0 ? Math.round(total / count) : 0;
            document.getElementById('rank-val').innerText = avg + "%";
            document.getElementById('grade-val').innerText = getGrade(avg);
            
            const badge = document.getElementById('res-badge');
            badge.innerText = avg >= 33 ? "PASSED" : "DETAINED";
            badge.style.background = avg >= 33 ? "var(--p)" : "var(--danger)";
            badge.style.color = "#fff";

            initAttendanceChart(s.attendance);
        }

        function getGrade(avg) {
            if(avg >= 90) return "A1";
            if(avg >= 80) return "A2";
            if(avg >= 70) return "B1";
            if(avg >= 60) return "B2";
            return "C";
        }

        function initAttendanceChart(att) {
            const ctx = document.getElementById('growthChart').getContext('2d');
            const data = [att.apr, att.may, att.jul, att.aug, att.sep, att.oct, att.nov, att.dec, att.jan, att.feb, att.mar].map(v => parseInt(v) || 0);
            
            const totalAtt = Math.round(data.reduce((a,b) => a+b, 0) / 11);
            document.getElementById('att-val').innerText = totalAtt + "%";

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Apr','May','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar'],
                    datasets: [{
                        label: 'Attendance %',
                        data: data,
                        borderColor: '#d4aa00',
                        backgroundColor: 'rgba(212,170,0,0.1)',
                        fill: true,
                        tension: 0.4,
                        borderWidth: 3,
                        pointRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { 
                        y: { min: 0, max: 100, ticks: { display: false }, grid: { display: false } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KPS | PREMIUM DIGITAL PORTAL</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root { 
            --primary: #002d5b; --secondary: #004a99; --accent: #ffd700; 
            --bg: #f3f6f9; --text: #2d3748; --success: #22c55e; --white: #ffffff;
        }
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; transition: all 0.3s ease; }
        body { background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        
        /* Ticker */
        .ticker-wrap { background: var(--primary); color: var(--accent); padding: 10px; font-weight: 800; font-size: 11px; text-align: center; border-bottom: 3px solid var(--accent); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        .container { width: 100%; max-width: 550px; margin: 0 auto; padding: 20px; flex-grow: 1; }

        /* Login Card with Hover */
        .auth-card { background: var(--white); padding: 40px 25px; border-radius: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); margin-top: 30px; border: 1px solid #eee; }
        .auth-card:hover { transform: translateY(-5px); box-shadow: 0 20px 45px rgba(0,0,0,0.1); }
        
        input { width: 100%; padding: 16px; border-radius: 15px; border: 2px solid #e2e8f0; font-size: 16px; outline: none; margin-bottom: 15px; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(0,45,91,0.1); }

        .btn { width: 100%; padding: 16px; border-radius: 15px; border: none; font-weight: 800; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--secondary); transform: scale(1.02); }

        /* Report Card Design */
        #dashboard { display: none; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .report-card { background: var(--white); border-radius: 35px; padding: 25px; box-shadow: 0 25px 60px rgba(0,0,0,0.08); border: 1px solid #e2e8f0; position: relative; overflow: hidden; }
        
        /* Glassmorphism Stats */
        .stats-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 25px; }
        .stat-item { background: #f8fafc; padding: 15px; border-radius: 20px; text-align: center; border: 1px solid #edf2f7; }
        .stat-item:hover { background: var(--white); border-color: var(--primary); }
        .stat-item b { font-size: 18px; color: var(--primary); display: block; }
        .stat-item small { font-size: 9px; font-weight: 800; color: #a0aec0; text-transform: uppercase; }

        /* Subject Progress */
        .subject-box { margin-bottom: 18px; padding: 5px; border-radius: 12px; }
        .subject-box:hover { background: #fcfcfc; }
        .subject-info { display: flex; justify-content: space-between; font-weight: 800; font-size: 13px; margin-bottom: 8px; }
        .progress-rail { background: #edf2f7; height: 12px; border-radius: 20px; overflow: hidden; }
        .progress-bar { height: 100%; border-radius: 20px; width: 0; transition: width 1.5s cubic-bezier(0.17, 0.67, 0.83, 0.67); }

        /* Remarks Section */
        .remarks-box { background: #fffdf0; padding: 15px; border-radius: 15px; border-left: 5px solid var(--accent); margin: 20px 0; font-size: 13px; font-weight: 700; color: #744210; }

        /* Fixed Footer & Signatures */
        .bottom-layout { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 30px; padding-top: 20px; border-top: 2px dashed #f1f5f9; }
        .sign-line { border-top: 2px solid #cbd5e0; margin-top: 10px; font-size: 10px; font-weight: 800; color: var(--primary); padding-top: 5px; text-align: center; width: 100px; }
        
        footer { text-align: center; padding: 30px; font-size: 11px; color: #a0aec0; font-weight: 700; background: transparent; }

        @media print { .btn, .ticker-wrap, footer { display: none !important; } .report-card { box-shadow: none; border: 1px solid #ddd; } }
    </style>
</head>
<body>

    <div class="ticker-wrap"><marquee>✨ KPS DIGITAL REPORT CARD • SESSION 2025–26 • VERIFIED BY KPS BOARD ✨</marquee></div>

    <div class="container">
        <div id="login-section">
            <h1 style="text-align:center; color:var(--primary); font-size: 45px; font-weight: 900;">KPS<span style="color:var(--accent)">.</span></h1>
            <div class="auth-card">
                <input type="text" id="stu_user" placeholder="Serial Number (e.g. 101)">
                <div style="position:relative;">
                    <input type="password" id="stu_pass" placeholder="Security PIN">
                </div>
                <button class="btn btn-primary" id="loginBtn">View Marksheet 🔒</button>
            </div>
        </div>

        <div id="dashboard">
            <div class="report-card">
                <div style="display:flex; justify-content:space-between; font-size:10px; font-weight:800; color:#a0aec0; margin-bottom:20px;">
                    <span id="meta-id">ID: -</span>
                    <span id="meta-date">DATE: -</span>
                </div>

                <div style="display:flex; align-items:center; gap:20px; margin-bottom:30px;">
                    <div id="stu-photo" class="stu-img" style="width:90px; height:90px; border-radius:22px; background:var(--primary); border:4px solid var(--accent); display:flex; align-items:center; justify-content:center; color:white; font-size:40px; font-weight:800; overflow:hidden;">?</div>
                    <div>
                        <h2 id="name-display" style="margin:0; font-size:24px; color:var(--primary);">Student Name</h2>
                        <p id="class-display" style="margin:5px 0; font-size:13px; font-weight:700; color:#718096;">Class: -</p>
                    </div>
                </div>

                <div class="stats-row">
                    <div class="stat-item"><small>Percentage</small><b id="avg-val">0%</b></div>
                    <div class="stat-item"><small>Grade</small><b id="grade-badge">-</b></div>
                    <div class="stat-item"><small>Attendance</small><b id="att-val">0%</b></div>
                    <div class="stat-item"><small>Result</small><b id="res-val">-</b></div>
                </div>

                <div id="marks-list"></div>

                <div class="remarks-box">
                    📝 REMARKS: <span id="remarks-text">Calculating performance...</span>
                </div>

                <div style="height:150px; margin:30px 0;"><canvas id="attChart"></canvas></div>

                <div class="bottom-layout">
                    <div class="sign-box"><div class="sign-line">TEACHER</div></div>
                    <div id="qrcode"></div>
                    <div class="sign-box"><div class="sign-line">PRINCIPAL</div></div>
                </div>
            </div>

            <button class="btn btn-primary" style="margin-top:20px;" onclick="window.print()">Print Report Card 🖨️</button>
            <button class="btn" style="margin-top:10px; background:#e2e8f0; color:#4a5568;" onclick="location.reload()">Secure Logout</button>
        </div>
    </div>

    <footer>© 2026 Kanpur Public School • All Rights Reserved</footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCQ6S-YfO61gEfB2Ad7neDU-nG4WNn1z8E",
            authDomain: "kanpur-public-school-d8f4a.firebaseapp.com",
            projectId: "kanpur-public-school-d8f4a",
            storageBucket: "kanpur-public-school-d8f4a.firebasestorage.app",
            messagingSenderId: "421329321742",
            appId: "1:421329321742:web:0cf01ae45063566bc9215f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('loginBtn').addEventListener('click', async () => {
            const u = document.getElementById('stu_user').value.trim();
            const p = document.getElementById('stu_pass').value.trim();
            if(!u || !p) return Swal.fire('Wait!', 'Enter both Serial No. and PIN', 'warning');

            try {
                const snap = await getDoc(doc(db, "student_data", u));
                if(snap.exists() && snap.data().info.password == p) {
                    document.getElementById('login-section').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                    renderData(snap.data());
                } else { Swal.fire('Access Denied', 'Invalid Credentials', 'error'); }
            } catch (e) { console.error(e); }
        });

        function renderData(data) {
            const info = data.info || {};
            const aca = data.academic || {};
            const att = data.attendance || {};

            document.getElementById('meta-id').innerText = "REPORT ID: KPS-" + info.serial_no;
            document.getElementById('meta-date').innerText = "DATE: " + new Date().toLocaleDateString('en-GB');
            document.getElementById('name-display').innerText = info.name;
            document.getElementById('class-display').innerText = `Class: ${info.class} | Section: ${info.section || 'A'}`;

            if(info.image) document.getElementById('stu-photo').innerHTML = `<img src="${info.image}" style="width:100%; height:100%; object-fit:cover;">`;
            
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), { text: "VERIFIED-"+info.serial_no, width: 60, height: 60 });

            // Subject Extraction (ULTRA ROBUST)
            const list = document.getElementById('marks-list');
            list.innerHTML = '';
            const icons = { english:'📖', hindi:'📙', maths:'🔢', physics:'⚡', chemistry:'🧪', science:'🔬', social:'🌍', computer:'💻', it:'💻', ai:'🤖', drawing:'🎨', gk:'🌍' };

            let englishScore = 0;
            let otherSubjects = [];

            // Fetching all keys from academic node
            Object.entries(aca).forEach(([key, val]) => {
                if(key === 'password' || val === "" || isNaN(val)) return;
                let score = parseInt(val);
                if(key.toLowerCase().includes('english')) englishScore = score;
                else otherSubjects.push({ name: key, score: score });
            });

            // Best of 5 Logic (Eng + Top 4)
            otherSubjects.sort((a,b) => b.score - a.score);
            let topFour = otherSubjects.slice(0, 4);
            let topFourNames = topFour.map(s => s.name);
            let totalMarks = englishScore + topFour.reduce((a,b) => a + b.score, 0);
            let perc = (totalMarks / 5).toFixed(1);

            // Render Subjects
            const drawRow = (n, s, inc) => {
                let icon = icons[n.toLowerCase()] || '📝';
                let color = s >= 75 ? '#22c55e' : (s >= 33 ? '#3182ce' : '#ef4444');
                list.innerHTML += `
                    <div class="subject-box">
                        <div class="subject-info">
                            <span>${icon} ${n.toUpperCase()} ${inc ? '<span class="best-tag">Included</span>' : ''}</span>
                            <span>${s}/100</span>
                        </div>
                        <div class="progress-rail"><div class="progress-bar" style="width:${s}%; background:${color}"></div></div>
                    </div>`;
            };

            drawRow('English', englishScore, true);
            otherSubjects.forEach(s => drawRow(s.name, s.score, topFourNames.includes(s.name)));

            // Stats Update
            document.getElementById('avg-val').innerText = perc + "%";
            document.getElementById('res-val').innerText = perc >= 33 ? "PASSED" : "FAILED";
            document.getElementById('res-val').style.color = perc >= 33 ? "#22c55e" : "#ef4444";

            // Grades & Remarks
            let g = "E", r = "Needs Improvement";
            if(perc >= 91) { g="A1"; r="Outstanding Performance! Keep it up."; }
            else if(perc>=81) { g="A2"; r="Excellent work, very consistent."; }
            else if(perc>=71) { g="B1"; r="Very Good! Can reach the top with more effort."; }
            else if(perc>=61) { g="B2"; r="Good performance, keep practicing."; }
            else if(perc>=33) { g="D"; r="Fair performance, work harder on weak subjects."; }
            
            document.getElementById('grade-badge').innerText = g;
            document.getElementById('remarks-text').innerText = r;

            // Chart
            const mths = ['apr','may','jul','aug','sep','oct','nov','dec','jan','feb','mar'];
            const scs = mths.map(m => parseInt(att[m]) || 0);
            document.getElementById('att-val').innerText = Math.round(scs.reduce((a,b)=>a+b,0)/11) + "%";
            new Chart(document.getElementById('attChart').getContext('2d'), {
                type: 'bar',
                data: { labels: ['Apr','May','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar'], datasets: [{ data: scs, backgroundColor: '#004a99', borderRadius: 5 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }
    </script>
</body>
</html>

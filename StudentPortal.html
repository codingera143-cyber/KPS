<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KPS | OFFICIAL DIGITAL REPORT CARD</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root { --primary: #002d5b; --secondary: #004a99; --accent: #ffd700; --bg: #f3f6f9; --text: #2d3748; --success: #22c55e; }
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .ticker-wrap { background: var(--primary); color: var(--accent); padding: 10px; font-weight: 800; font-size: 11px; text-align: center; border-bottom: 3px solid var(--accent); }
        .container { width: 100%; max-width: 550px; margin: 0 auto; padding: 15px; flex-grow: 1; }

        /* Login */
        .auth-card { background: white; padding: 35px 25px; border-radius: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); margin-top: 40px; }
        .input-wrapper { position: relative; margin-bottom: 18px; }
        input { width: 100%; padding: 16px; border-radius: 15px; border: 2px solid #e2e8f0; font-size: 16px; outline: none; }
        .toggle-pass { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--primary); font-size: 20px; }
        .btn { width: 100%; padding: 16px; border-radius: 15px; border: none; font-weight: 800; cursor: pointer; font-size: 16px; }
        .btn-primary { background: var(--primary); color: white; }

        /* Dashboard */
        #dashboard { display: none; }
        .report-card { background: white; border-radius: 35px; padding: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; position: relative; }
        .report-header { display: flex; justify-content: space-between; font-size: 10px; color: #a0aec0; margin-bottom: 20px; font-weight: 800; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; }
        .profile-area { display: flex; align-items: center; gap: 20px; margin-bottom: 25px; }
        .stu-img { width: 85px; height: 85px; border-radius: 20px; background: var(--primary); border: 4px solid var(--accent); display: flex; align-items: center; justify-content: center; color: white; font-size: 35px; font-weight: 800; overflow: hidden; }
        .stu-img img { width: 100%; height: 100%; object-fit: cover; }
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 25px; }
        .stat-item { background: #f8fafc; padding: 12px 5px; border-radius: 18px; text-align: center; border: 1px solid #edf2f7; }
        .stat-item small { font-size: 8px; color: #a0aec0; font-weight: 800; display: block; }
        .stat-item b { font-size: 15px; color: var(--primary); margin-top: 3px; display: block; }

        .subject-box { margin-bottom: 15px; }
        .subject-info { display: flex; justify-content: space-between; font-weight: 800; font-size: 13px; margin-bottom: 5px; align-items: center; }
        .best-tag { font-size: 9px; color: var(--success); margin-left: 5px; background: #e8f5e9; padding: 2px 6px; border-radius: 6px; }
        .progress-rail { background: #edf2f7; height: 10px; border-radius: 20px; overflow: hidden; }
        .progress-bar { height: 100%; border-radius: 20px; transition: width 1.5s ease; }

        .bottom-layout { display: grid; grid-template-columns: 1fr 1fr 80px; align-items: flex-end; gap: 10px; margin-top: 30px; padding-top: 20px; border-top: 2px dashed #f1f5f9; }
        .sign-line { border-top: 2px solid #cbd5e0; margin-top: 10px; font-size: 9px; font-weight: 800; color: var(--primary); padding-top: 5px; text-align: center; }
        
        @media print { .ticker-wrap, .btn, .auth-card, #logout-btn { display: none !important; } }
    </style>
</head>
<body>

    <div class="ticker-wrap"><marquee>SESSION 2025–26 | OFFICIAL DIGITAL PROGRESS REPORT | KPS BOARD</marquee></div>

    <div class="container">
        <div id="login-section">
            <h1 style="text-align:center; color:var(--primary); font-size: 40px;">KPS<span style="color:var(--accent)">.</span></h1>
            <div class="auth-card">
                <div class="input-wrapper"><input type="text" id="stu_user" placeholder="Serial No."></div>
                <div class="input-wrapper"><input type="password" id="stu_pass" placeholder="Security PIN"><span class="toggle-pass" id="eyeBtn">👁️</span></div>
                <button class="btn btn-primary" id="loginBtn">Access Marksheet 🔒</button>
            </div>
        </div>

        <div id="dashboard">
            <div class="report-card">
                <div class="report-header"><span id="meta-id">-</span><span id="meta-date">-</span></div>
                <div class="profile-area">
                    <div id="stu-photo" class="stu-img">?</div>
                    <div class="stu-info"><h2 id="name-display">Name</h2><p id="class-display" style="font-size:12px; font-weight:700; color:#718096; margin:0;">Class: -</p></div>
                </div>
                <div class="stats-row">
                    <div class="stat-item"><small>Attendance</small><b id="att-val">0%</b></div>
                    <div class="stat-item"><small>Percentage</small><b id="avg-val">0%</b></div>
                    <div class="stat-item"><small>Grade</small><b id="grade-badge">-</b></div>
                    <div class="stat-item"><small>Result</small><b id="res-val">-</b></div>
                </div>
                <div id="marks-list"></div>
                <div style="height: 150px; margin: 25px 0;"><canvas id="attChart"></canvas></div>
                <div class="bottom-layout">
                    <div class="sign-box"><div style="height:30px;"></div><div class="sign-line">CLASS TEACHER</div></div>
                    <div class="sign-box"><div style="height:30px;"></div><div class="sign-line">PRINCIPAL</div></div>
                    <div id="qrcode"></div>
                </div>
            </div>
            <button class="btn btn-primary" style="margin-top:20px;" onclick="window.print()">Print Official Marksheet 🖨️</button>
            <button class="btn" style="margin-top:10px; background:#e2e8f0;" onclick="location.reload()">Sign Out</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCQ6S-YfO61gEfB2Ad7neDU-nG4WNn1z8E",
            authDomain: "kanpur-public-school-d8f4a.firebaseapp.com",
            projectId: "kanpur-public-school-d8f4a",
            storageBucket: "kanpur-public-school-d8f4a.firebasestorage.app",
            messagingSenderId: "421329321742",
            appId: "1:421329321742:web:0cf01ae45063566bc9215f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('eyeBtn').addEventListener('click', () => {
            const p = document.getElementById('stu_pass');
            p.type = p.type === "password" ? "text" : "password";
        });

        document.getElementById('loginBtn').addEventListener('click', async () => {
            const u = document.getElementById('stu_user').value.trim();
            const p = document.getElementById('stu_pass').value.trim();
            if(!u || !p) return Swal.fire('Error', 'Enter Details', 'warning');
            
            try {
                const snap = await getDoc(doc(db, "student_data", u));
                if(snap.exists() && snap.data().info.password == p) {
                    document.getElementById('login-section').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                    loadData(snap.data());
                } else { Swal.fire('Error', 'Wrong ID/PIN', 'error'); }
            } catch (e) { console.error(e); }
        });

        function loadData(data) {
            const info = data.info || {};
            const aca = data.academic || {};
            const att = data.attendance || {};

            document.getElementById('meta-id').innerText = "ID: KPS-2026-" + info.serial_no;
            document.getElementById('meta-date').innerText = "DATE: " + new Date().toLocaleDateString('en-GB');
            document.getElementById('name-display').innerText = info.name;
            document.getElementById('class-display').innerText = `Class: ${info.class} | Section: ${info.section || 'A'}`;

            const photo = document.getElementById('stu-photo');
            if(info.image && info.image.length > 50) photo.innerHTML = `<img src="${info.image}">`;
            else photo.innerText = info.name.charAt(0);

            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), { text: "KPS-"+info.serial_no, width: 60, height: 60 });

            const list = document.getElementById('marks-list');
            list.innerHTML = '';
            const icons = { english:'📖', hindi:'📙', maths:'🔢', physics:'⚡', chem:'🧪', music:'🎸', science:'🔬', social:'🌍', computer:'💻', it:'💻', ai:'🤖', drawing:'🎨', gk:'🌍' };

            let allSubs = [];
            let englishData = null;

            // Robust looping: Har field ko check karega
            Object.keys(aca).forEach(key => {
                let val = aca[key];
                if(key === 'password' || val === "" || isNaN(val)) return;

                let score = parseInt(val);
                let subName = key.trim();

                if(subName.toLowerCase() === 'english') {
                    englishData = { name: subName, score: score };
                } else {
                    allSubs.push({ name: subName, score: score });
                }
            });

            // Agar English nahi milta toh crash na ho
            if(!englishData) englishData = { name: 'English', score: 0 };

            // Sort others for Top 4
            allSubs.sort((a, b) => b.score - a.score);
            let topFour = allSubs.slice(0, 4);
            let topFourNames = topFour.map(s => s.name);

            // Calculation Best of 5 (Eng + Top 4)
            let total = englishData.score + topFour.reduce((a, b) => a + b.score, 0);
            let perc = (total / 5).toFixed(1);

            // UI Rendering
            const render = (name, score, included) => {
                let icon = icons[name.toLowerCase()] || '📝';
                let color = score >= 75 ? '#22c55e' : (score >= 33 ? '#3182ce' : '#ef4444');
                list.innerHTML += `
                    <div class="subject-box">
                        <div class="subject-info">
                            <span>${icon} ${name.toUpperCase()} ${included ? '<span class="best-tag">Included</span>' : ''}</span>
                            <span>${score}/100</span>
                        </div>
                        <div class="progress-rail"><div class="progress-bar" style="width:${score}%; background:${color}"></div></div>
                    </div>`;
            };

            render(englishData.name, englishData.score, true);
            allSubs.forEach(s => render(s.name, s.score, topFourNames.includes(s.name)));

            document.getElementById('avg-val').innerText = perc + "%";
            document.getElementById('res-val').innerText = perc >= 33 ? "PASSED" : "FAILED";
            document.getElementById('res-val').style.color = perc >= 33 ? "#22c55e" : "#ef4444";

            let g = "E";
            if(perc >= 91) g="A1"; else if(perc>=81) g="A2"; else if(perc>=71) g="B1"; else if(perc>=61) g="B2";
            else if(perc>=51) g="C1"; else if(perc>=41) g="C2"; else if(perc>=33) g="D";
            document.getElementById('grade-badge').innerText = g;

            const mths = ['apr','may','jul','aug','sep','oct','nov','dec','jan','feb','mar'];
            const scs = mths.map(m => parseInt(att[m]) || 0);
            document.getElementById('att-val').innerText = Math.round(scs.reduce((a,b)=>a+b,0)/11) + "%";
            new Chart(document.getElementById('attChart').getContext('2d'), {
                type: 'bar',
                data: { labels: ['Apr','May','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar'], datasets: [{ data: scs, backgroundColor: '#004a99', borderRadius: 5 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }
    </script>
</body>
</html>

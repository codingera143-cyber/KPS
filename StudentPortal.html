<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KPS | OFFICIAL PORTAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root { --primary: #002d5b; --accent: #ffd700; --bg: #f3f6f9; }
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; transition: 0.3s; }
        body { background: var(--bg); margin: 0; padding: 0; }
        
        .school-header { text-align: center; padding: 25px 10px; background: white; border-bottom: 4px solid var(--primary); }
        .logo-img { width: 70px; height: 70px; margin-bottom: 10px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); }

        .container { max-width: 500px; margin: 0 auto; padding: 20px; }
        
        /* Login UI */
        .auth-card { background: white; padding: 30px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); margin-top: 20px; }
        .input-wrapper { position: relative; margin-bottom: 15px; }
        input { width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #e2e8f0; font-size: 16px; outline: none; }
        .eye { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 18px; color: var(--primary); }

        .btn { width: 100%; padding: 16px; border-radius: 12px; border: none; font-weight: 800; cursor: pointer; background: var(--primary); color: white; font-size: 16px; box-shadow: 0 4px 12px rgba(0,45,91,0.2); }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,45,91,0.3); }

        /* Report Card */
        #dashboard { display: none; }
        .report-card { background: white; border-radius: 30px; padding: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); border: 1px solid #eee; }
        
        .profile { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; border-bottom: 1px solid #f1f5f9; padding-bottom: 15px; }
        .stu-img-circ { width: 80px; height: 80px; border-radius: 18px; background: var(--primary); border: 3px solid var(--accent); overflow: hidden; display: flex; align-items: center; justify-content: center; color: white; font-size: 30px; font-weight: 800; }
        .stu-img-circ img { width: 100%; height: 100%; object-fit: cover; }

        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 20px; }
        .stat-box { background: #f8fafc; padding: 10px 2px; border-radius: 12px; text-align: center; border: 1px solid #edf2f7; }
        .stat-box small { font-size: 7px; color: #a0aec0; font-weight: 800; display: block; text-transform: uppercase; }
        .stat-box b { font-size: 13px; color: var(--primary); }

        .sub-row { margin-bottom: 12px; }
        .sub-label { display: flex; justify-content: space-between; font-weight: 800; font-size: 12px; margin-bottom: 4px; }
        .tag { font-size: 7px; color: #22c55e; background: #e8f5e9; padding: 2px 4px; border-radius: 4px; margin-left: 5px; }
        .rail { background: #edf2f7; height: 8px; border-radius: 10px; overflow: hidden; }
        .fill { height: 100%; border-radius: 10px; }

        .remarks { background: #fffdf0; border-left: 4px solid var(--accent); padding: 12px; border-radius: 12px; font-size: 11px; font-weight: 700; margin: 15px 0; }

        .footer-sec { display: grid; grid-template-columns: 1fr 1fr 60px; align-items: flex-end; gap: 10px; margin-top: 25px; }
        .sign { border-top: 1px solid #ccc; font-size: 9px; font-weight: 800; text-align: center; color: var(--primary); padding-top: 4px; }

        @media print { .btn, .eye, .school-header { display: none !important; } }
    </style>
</head>
<body>

    <div id="login-section">
        <div class="school-header">
            <img src="https://img.icons8.com/color/96/university.png" class="logo-img">
            <h1 style="color:var(--primary); margin:0; font-size: 28px; font-weight: 900;">KPS DIGITAL</h1>
            <p style="margin:0; font-size:12px; color:#666; font-weight:700;">OFFICIAL RESULT PORTAL 2026</p>
        </div>
        <div class="container">
            <div class="auth-card">
                <div class="input-wrapper"><input type="text" id="stu_user" placeholder="Serial No."></div>
                <div class="input-wrapper"><input type="password" id="stu_pass" placeholder="Security PIN"><span class="eye" id="toggleEye">👁️</span></div>
                <button class="btn" id="loginBtn">Access Marksheet 🔒</button>
            </div>
        </div>
    </div>

    <div id="dashboard" class="container">
        <div class="report-card">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px; font-size:9px; font-weight:800; color:#999;">
                <span id="r-id">ID: -</span> <span id="r-date">DATE: -</span>
            </div>

            <div class="profile">
                <div id="photo-div" class="stu-img-circ">?</div>
                <div>
                    <h2 id="n-txt" style="margin:0; font-size:22px; color:var(--primary);">Name</h2>
                    <p id="c-txt" style="margin:0; font-size:12px; color:#666; font-weight:700;">Class: -</p>
                </div>
            </div>

            <div class="stats">
                <div class="stat-box"><small>Percent</small><b id="s-perc">0%</b></div>
                <div class="stat-box"><small>Grade</small><b id="s-grad">-</b></div>
                <div class="stat-box"><small>Attend</small><b id="s-att">0%</b></div>
                <div class="stat-box"><small>Result</small><b id="s-res">-</b></div>
            </div>

            <div id="sub-list"></div>

            <div class="remarks">📝 REMARKS: <span id="s-rem">...</span></div>

            <div style="height: 150px; margin: 20px 0;"><canvas id="myChart"></canvas></div>

            <div class="footer-sec">
                <div class="sign">CLASS TEACHER</div>
                <div class="sign">PRINCIPAL</div>
                <div id="qr"></div>
            </div>
        </div>
        <button class="btn" style="margin-top:15px;" onclick="window.print()">Print Report Card 🖨️</button>
        <button class="btn" style="margin-top:8px; background:#e2e8f0; color:#4a5568;" onclick="location.reload()">Logout</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCQ6S-YfO61gEfB2Ad7neDU-nG4WNn1z8E",
            authDomain: "kanpur-public-school-d8f4a.firebaseapp.com",
            projectId: "kanpur-public-school-d8f4a",
            storageBucket: "kanpur-public-school-d8f4a.firebasestorage.app",
            messagingSenderId: "421329321742",
            appId: "1:421329321742:web:0cf01ae45063566bc9215f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('toggleEye').onclick = () => {
            const p = document.getElementById('stu_pass');
            p.type = p.type === 'password' ? 'text' : 'password';
        };

        document.getElementById('loginBtn').onclick = async () => {
            const u = document.getElementById('stu_user').value.trim();
            const p = document.getElementById('stu_pass').value.trim();
            if(!u || !p) return;

            const snap = await getDoc(doc(db, "student_data", u));
            if(snap.exists() && snap.data().info.password == p) {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                loadMarks(snap.data());
            } else { Swal.fire('Error', 'Invalid PIN/ID', 'error'); }
        };

        function loadMarks(data) {
            const { info, academic, attendance } = data;
            document.getElementById('r-id').innerText = "KPS-2026-" + info.serial_no;
            document.getElementById('n-txt').innerText = info.name;
            document.getElementById('c-txt').innerText = `Class: ${info.class} (${info.section || 'A'})`;
            document.getElementById('r-date').innerText = new Date().toLocaleDateString();

            // Image Handler: Agar info.image mein URL hai toh dikhayega
            if(info.image) {
                document.getElementById('photo-div').innerHTML = `<img src="${info.image}">`;
            } else {
                document.getElementById('photo-div').innerText = info.name.charAt(0);
            }

            // Universal Subject Scanner
            let subjects = [];
            let engVal = 0;

            // Is loop ko dhyan se dekho, ye kisi bhi "key" ko subject maan lega agar wo number hai
            Object.entries(academic || {}).forEach(([key, val]) => {
                if(key.toLowerCase().includes('password')) return;
                
                let num = parseInt(val);
                if(!isNaN(num)) {
                    if(key.toLowerCase().includes('english')) engVal = num;
                    else subjects.push({ name: key, score: num });
                }
            });

            // Best of 5 (Eng + Top 4)
            subjects.sort((a,b) => b.score - a.score);
            let top4 = subjects.slice(0, 4);
            let top4Names = top4.map(s => s.name);
            let finalTotal = engVal + top4.reduce((a,b) => a + b.score, 0);
            let finalPerc = (finalTotal / 5).toFixed(1);

            // Render UI
            const list = document.getElementById('sub-list');
            list.innerHTML = '';
            
            const draw = (n, s, inc) => {
                let color = s >= 75 ? '#22c55e' : (s >= 33 ? '#3182ce' : '#ef4444');
                list.innerHTML += `<div class="sub-row">
                    <div class="sub-label"><span>${n.toUpperCase()} ${inc ? '<span class="tag">Included</span>' : ''}</span> <span>${s}/100</span></div>
                    <div class="rail"><div class="fill" style="width:${s}%; background:${color}"></div></div>
                </div>`;
            };

            draw('English', engVal, true);
            subjects.forEach(s => draw(s.name, s.score, top4Names.includes(s.name)));

            document.getElementById('s-perc').innerText = finalPerc + "%";
            document.getElementById('s-res').innerText = finalPerc >= 33 ? "PASS" : "FAIL";
            document.getElementById('s-res').style.color = finalPerc >= 33 ? "#22c55e" : "#ef4444";

            let g = "D", rem = "Work harder!";
            if(finalPerc >= 91) { g="A1"; rem="Outstanding! Proud of your success."; }
            else if(finalPerc >= 81) { g="A2"; rem="Excellent work, keep it up!"; }
            else if(finalPerc >= 71) { g="B1"; rem="Good Job! Aim for A1 next time."; }
            document.getElementById('s-grad').innerText = g;
            document.getElementById('s-rem').innerText = rem;

            // Chart with Month Tooltip
            const mFull = ['April','May','July','August','September','October','November','December','January','February','March'];
            const mKeys = ['apr','may','jul','aug','sep','oct','nov','dec','jan','feb','mar'];
            const attData = mKeys.map(k => parseInt(attendance[k]) || 0);
            document.getElementById('s-att').innerText = Math.round(attData.reduce((a,b)=>a+b,0)/11) + "%";

            new Chart(document.getElementById('myChart'), {
                type: 'bar',
                data: { labels: mFull, datasets: [{ data: attData, backgroundColor: '#004a99', borderRadius: 4 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { enabled: true } } }
            });

            document.getElementById('qr').innerHTML = "";
            new QRCode(document.getElementById("qr"), { text: "KPS-STU-"+info.serial_no, width: 60, height: 60 });
        }
    </script>
</body>
</html>

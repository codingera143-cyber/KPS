<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STUDENT PORTAL | KPS SCHOOL</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root { --p: #003366; --accent: #d4aa00; --bg: #f1f5f9; --card: #ffffff; --t: #0f172a; --s: #64748b; }
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; transition: 0.3s; }
        body { background: var(--bg); color: var(--t); margin: 0; padding: 0; }
        .ticker-wrap { background: var(--p); color: var(--accent); padding: 10px 0; font-size: 11px; font-weight: 800; text-align: center; border-bottom: 2px solid var(--accent); }
        .container { width: 95%; max-width: 500px; margin: 0 auto; padding: 15px; }
        
        .auth-card { background: var(--card); padding: 30px; border-radius: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 16px; border-radius: 15px; border: 2px solid #e2e8f0; outline: none; font-size: 16px; margin-bottom: 15px; }
        .btn { width: 100%; padding: 18px; border-radius: 18px; border: none; font-weight: 800; cursor: pointer; font-size: 15px; background: var(--p); color: var(--accent); }
        
        #dashboard { display: none; }
        .report-paper { background: white; padding: 25px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.08); position: relative; overflow: hidden; }
        .status-badge { position: absolute; top: 18px; right: -40px; transform: rotate(45deg); padding: 6px 45px; font-size: 10px; font-weight: 900; background: var(--p); color: white; }
        
        .stu-img-container { width: 80px; height: 80px; border-radius: 20px; background: var(--p); display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 32px; border: 3px solid var(--accent); overflow: hidden; }
        .stu-img-container img { width: 100%; height: 100%; object-fit: cover; }
        
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0; }
        .stat-item { background: #f8fafc; padding: 12px 5px; border-radius: 15px; text-align: center; border: 1px solid #f1f5f9; }
        
        .sub-row { margin-bottom: 12px; }
        .sub-info { display: flex; justify-content: space-between; font-size: 11px; font-weight: 800; margin-bottom: 4px; }
        .bar-bg { background: #f1f5f9; height: 8px; border-radius: 10px; }
        .bar-fill { height: 100%; border-radius: 10px; background: var(--p); }
    </style>
</head>
<body>

    <div class="ticker-wrap"><marquee>🏅 STUDENT PORTAL | SESSION 2025-26 | KPS SCHOOL |</marquee></div>

    <div class="container">
        <div id="login-section">
            <h1 style="text-align:center; font-size: 40px; font-weight: 900; color: var(--p);">KPS<span style="color:var(--accent)">Track</span></h1>
            <div class="auth-card">
                <input type="text" id="stu_user" placeholder="Serial No (e.g. 313)">
                <input type="password" id="stu_pass" placeholder="Security PIN">
                <button class="btn" id="loginBtn" onclick="loginCheck()">Verify Credentials</button>
            </div>
        </div>

        <div id="dashboard">
            <div class="report-paper">
                <div class="status-badge">RESULT LIVE</div>
                <div style="display:flex; align-items:center; gap:15px; margin-bottom:20px;">
                    <div id="img-container" class="stu-img-container">?</div>
                    <div>
                        <h2 id="name-display" style="margin:0; font-size:24px; color:var(--p);"></h2>
                        <span id="meta-display" style="font-size:11px; font-weight:700; color:var(--accent);"></span>
                    </div>
                </div>

                <div class="stat-grid">
                    <div class="stat-item"><small>Attendance</small><br><b id="att-val">0%</b></div>
                    <div class="stat-item"><small>Result</small><br><b id="res-status">PASSED</b></div>
                    <div class="stat-item"><small>Overall</small><br><b id="avg-val">0%</b></div>
                </div>

                <div id="marks-grid"></div>
                <div style="height:150px; margin: 20px 0;"><canvas id="growthChart"></canvas></div>

                <div style="background:#f8fafc; padding:12px; border-radius:12px; border-left:4px solid var(--accent); font-size:10px;">
                    <strong>REMARKS:</strong> <span id="remark-text"></span>
                </div>
                
                <div style="display: flex; justify-content: space-between; margin-top: 20px; align-items: center;">
                    <div id="qrcode"></div>
                    <div style="text-align:right; font-size:9px; color:#94a3b8;">
                        ID: <span id="report-id"></span><br>DATE: <span id="gen-date"></span>
                    </div>
                </div>
            </div>
            <button class="btn" style="margin-top:20px;" onclick="window.print()">Download Marksheet 📄</button>
            <button class="btn" style="background:transparent; color:var(--s);" onclick="location.reload()">Sign Out</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCQ6S-YfO61gEfB2Ad7neDU-nG4WNn1z8E",
            authDomain: "kanpur-public-school-d8f4a.firebaseapp.com",
            projectId: "kanpur-public-school-d8f4a",
            storageBucket: "kanpur-public-school-d8f4a.firebasestorage.app",
            messagingSenderId: "421329321742",
            appId: "1:421329321742:web:0cf01ae45063566bc9215f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.loginCheck = async function() {
            const u = document.getElementById('stu_user').value.trim();
            const p = document.getElementById('stu_pass').value.trim();
            const btn = document.getElementById('loginBtn');

            if(!u || !p) return Swal.fire('Error', 'Please enter ID and PIN', 'warning');

            btn.innerText = "Connecting...";
            btn.disabled = true;

            try {
                const docRef = doc(db, "student_data", u);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const s = docSnap.data();
                    if (s.info.password.toString() === p) {
                        loadUI(s);
                    } else {
                        Swal.fire('Error', 'Wrong Security PIN!', 'error');
                        resetBtn();
                    }
                } else {
                    Swal.fire('Not Found', 'Invalid Serial Number!', 'question');
                    resetBtn();
                }
            } catch (err) {
                console.error(err);
                Swal.fire('Connection Error', 'Please check internet or Firebase Rules', 'error');
                resetBtn();
            }
        }

        function resetBtn() {
            const btn = document.getElementById('loginBtn');
            btn.innerText = "Verify Credentials";
            btn.disabled = false;
        }

        function loadUI(s) {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';

            document.getElementById('name-display').innerText = s.info.name;
            document.getElementById('meta-display').innerText = `CLASS: ${s.info.class} | SECTION: ${s.info.section}`;
            document.getElementById('report-id').innerText = s.info.serial_no;
            document.getElementById('gen-date').innerText = new Date().toLocaleDateString('en-GB');
            document.getElementById('remark-text').innerText = s.info.advice || "Keep it up!";

            if(s.info.image) document.getElementById('img-container').innerHTML = `<img src="${s.info.image}">`;
            else document.getElementById('img-container').innerText = s.info.name[0];

            new QRCode(document.getElementById("qrcode"), { text: "ID:"+s.info.serial_no, width: 50, height: 50 });

            // Marks Logic
            const grid = document.getElementById('marks-grid');
            grid.innerHTML = '';
            let total = 0, count = 0;

            for (const [sub, val] of Object.entries(s.academic)) {
                if (val && val !== "" && !isNaN(val)) {
                    const score = parseInt(val);
                    total += score;
                    count++;
                    grid.innerHTML += `
                        <div class="sub-row">
                            <div class="sub-info"><span>${sub.toUpperCase()}</span><span>${score}%</span></div>
                            <div class="bar-bg"><div class="bar-fill" style="width:${score}%"></div></div>
                        </div>`;
                }
            }

            const avg = count > 0 ? Math.round(total / count) : 0;
            document.getElementById('avg-val').innerText = avg + "%";
            document.getElementById('res-status').innerText = avg >= 33 ? "PASSED" : "FAILED";

            initChart(s.attendance);
        }

        function initChart(att) {
            const ctx = document.getElementById('growthChart').getContext('2d');
            const data = [att.apr, att.may, att.jul, att.aug, att.sep, att.oct, att.nov, att.dec, att.jan, att.feb, att.mar].map(v => parseInt(v) || 0);
            
            const totalAtt = Math.round(data.reduce((a,b) => a+b, 0) / 11);
            document.getElementById('att-val').innerText = totalAtt + "%";

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Apr','May','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar'],
                    datasets: [{
                        label: 'Attendance',
                        data: data,
                        borderColor: '#d4aa00',
                        tension: 0.4,
                        fill: false,
                        borderWidth: 2
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { display: false, min: 0, max: 100 }, x: { grid: { display: false } } }
                }
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STUDENT PORTAL | KPS PREMIUM</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root { --primary: #003366; --secondary: #004080; --accent: #ffd700; --bg: #f0f4f8; --text: #1a202c; --success: #22c55e; --danger: #ef4444; }
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
        
        .ticker-wrap { background: linear-gradient(90deg, var(--primary), var(--secondary)); color: var(--accent); padding: 12px 0; font-size: 12px; font-weight: 800; text-align: center; border-bottom: 3px solid var(--accent); width: 100%; }
        .container { width: 100%; max-width: 550px; margin: 20px auto; padding: 20px; flex: 1; }
        
        .auth-card { background: white; padding: 40px 30px; border-radius: 30px; box-shadow: 0 25px 50px rgba(0,51,102,0.1); }
        .input-wrapper { position: relative; margin-bottom: 20px; }
        input { width: 100%; padding: 18px; border-radius: 15px; border: 2px solid #e2e8f0; font-size: 16px; background: #f8fafc; }
        .toggle-pass { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--primary); display: flex; align-items: center; }

        .btn { width: 100%; padding: 18px; border-radius: 18px; border: none; font-weight: 800; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); margin-top: 15px; }

        #dashboard { display: none; }
        .report-paper { background: #fff; padding: 30px; border-radius: 35px; box-shadow: 0 20px 60px rgba(0,0,0,0.08); position: relative; overflow: hidden; border: 1px solid #f1f5f9; }
        .status-ribbon { position: absolute; top: 25px; right: -50px; transform: rotate(45deg); padding: 8px 60px; font-size: 12px; font-weight: 900; color: white; }
        
        .profile-header { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
        .stu-img-box { width: 90px; height: 90px; border-radius: 20px; background: var(--primary); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 35px; border: 3px solid var(--accent); overflow: hidden; }
        .stu-img-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
        .stat-card { background: #f8fafc; padding: 12px; border-radius: 15px; text-align: center; border: 1px solid #edf2f7; }
        .stat-card b { font-size: 18px; color: var(--primary); }

        .subject-row { display: flex; justify-content: space-between; background: #fff; padding: 12px; border-radius: 12px; margin-bottom: 8px; border: 1px solid #f1f5f9; }
        .chart-box { background: #fff; height: 200px; margin: 20px 0; }
        
        .sig-section { display: flex; justify-content: space-between; margin-top: 40px; text-align: center; font-size: 10px; font-weight: bold; }
        .sig-box { width: 100px; border-top: 2px solid #ddd; padding-top: 5px; }

        @media print { .ticker-wrap, .btn, footer, #login-section, .toggle-pass { display: none !important; } }
    </style>
</head>
<body>

    <div class="ticker-wrap"><marquee>✨ KPS STUDENT PORTAL | SESSION 2025-26 | SECURE ACCESS ✨</marquee></div>

    <div class="container">
        <div id="login-section">
            <h1 style="text-align:center; color:var(--primary); font-size:35px;">KPS<span style="color:var(--accent)">Portal</span></h1>
            <div class="auth-card">
                <div class="input-wrapper">
                    <input type="text" id="stu_user" placeholder="Serial No. (e.g. 313)">
                </div>
                <div class="input-wrapper">
                    <input type="password" id="stu_pass" placeholder="Security PIN">
                    <span class="toggle-pass" id="eyeBtn">
                        <svg id="eyeSvg" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </span>
                </div>
                <button class="btn btn-primary" id="loginBtn">Verify & Access 🔒</button>
            </div>
        </div>

        <div id="dashboard">
            <div class="report-paper">
                <div id="statusRibbon" class="status-ribbon">RESULT</div>
                <div class="profile-header">
                    <div id="img-container" class="stu-img-box">?</div>
                    <div>
                        <h2 id="name-display" style="margin:0; color:var(--primary); font-size:22px;">Name</h2>
                        <div style="font-size:11px; font-weight:700; color:#64748b;">
                            CLASS: <span id="class-display">-</span> | ID: <span id="id-display">-</span>
                        </div>
                    </div>
                </div>

                <div class="stat-grid">
                    <div class="stat-card"><small>ATTENDANCE</small><br><b id="att-val">0%</b></div>
                    <div class="stat-card"><small>PERCENTAGE</small><br><b id="avg-val">0%</b></div>
                    <div class="stat-card"><small>GRADE</small><br><b id="grade-val">-</b></div>
                </div>

                <div id="marks-container"></div>

                <div class="chart-box"><canvas id="attendanceChart"></canvas></div>

                <div style="background:#f0f9ff; padding:15px; border-radius:15px; font-size:12px; border-left:4px solid var(--primary);">
                    <strong>REMARKS:</strong> <span id="remark-text">-</span>
                </div>

                <div class="sig-section">
                    <div class="sig-box">CLASS TEACHER</div>
                    <div id="qrcode"></div>
                    <div class="sig-box">PRINCIPAL</div>
                </div>
            </div>
            <button class="btn btn-primary" style="margin-top:20px;" onclick="window.print()">Download Marksheet</button>
            <button class="btn btn-outline" onclick="location.reload()">Sign Out</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCQ6S-YfO61gEfB2Ad7neDU-nG4WNn1z8E",
            authDomain: "kanpur-public-school-d8f4a.firebaseapp.com",
            projectId: "kanpur-public-school-d8f4a",
            storageBucket: "kanpur-public-school-d8f4a.firebasestorage.app",
            messagingSenderId: "421329321742",
            appId: "1:421329321742:web:0cf01ae45063566bc9215f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- EYE ICON LOGIC ---
        document.getElementById('eyeBtn').addEventListener('click', () => {
            const p = document.getElementById('stu_pass');
            const s = document.getElementById('eyeSvg');
            if(p.type === "password") {
                p.type = "text";
                s.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M1 1l22 22"></path><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>';
            } else {
                p.type = "password";
                s.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
            }
        });

        // --- LOGIN LOGIC ---
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const u = document.getElementById('stu_user').value.trim();
            const p = document.getElementById('stu_pass').value.trim();
            const btn = document.getElementById('loginBtn');

            if(!u || !p) return Swal.fire('Error', 'Enter ID & PIN', 'warning');
            
            btn.innerHTML = "Opening..."; btn.disabled = true;

            try {
                const snap = await getDoc(doc(db, "student_data", u));
                if(snap.exists() && snap.data().info.password == p) {
                    document.getElementById('login-section').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                    loadUI(snap.data());
                } else {
                    Swal.fire('Failed', 'Wrong Credentials', 'error');
                    btn.innerHTML = "Verify & Access 🔒"; btn.disabled = false;
                }
            } catch (e) {
                Swal.fire('Error', 'Connection Failed', 'error');
                btn.disabled = false;
            }
        });

        function loadUI(s) {
            const info = s.info || {};
            document.getElementById('name-display').innerText = info.name || "Student";
            document.getElementById('class-display').innerText = info.class || "-";
            document.getElementById('id-display').innerText = info.serial_no || "-";
            document.getElementById('remark-text').innerText = info.advice || "Keep it up!";

            if(info.image) document.getElementById('img-container').innerHTML = `<img src="${info.image}">`;
            else document.getElementById('img-container').innerText = (info.name || "S").charAt(0);

            new QRCode(document.getElementById("qrcode"), { text: "ID:"+info.serial_no, width: 50, height: 50 });

            processMarks(s.academic || {}, info.class, info.section);
            drawChart(s.attendance || {});
        }

        function processMarks(aca, cls, sec) {
            const container = document.getElementById('marks-container');
            container.innerHTML = '';
            
            // Simplified Rule Check
            let optionalKeys = ['arts', 'gk'];
            let c = (cls || "").toString().toUpperCase();
            if(c.includes('IX') || c.includes('X')) optionalKeys.push('it', 'computer', 'ai');
            if(c.includes('D')) optionalKeys.push('banking');
            if(c.includes('XI') || c.includes('XII')) optionalKeys.push('music', 'hindi', 'physical');

            let marksArr = [];
            let english = { name: 'ENGLISH', score: 0 };

            for(let [k, v] of Object.entries(aca)) {
                if(v === "" || isNaN(v)) continue;
                let val = parseInt(v);
                if(k.toLowerCase() === 'english') english.score = val;
                else marksArr.push({ name: k.toUpperCase(), score: val, isOpt: optionalKeys.some(ok => k.toLowerCase().includes(ok)) });
            }

            // Best of 5 Logic
            marksArr.sort((a,b) => b.score - a.score);
            let finalFive = [english];
            let topMain = marksArr.filter(m => !m.isOpt).slice(0, 4);
            let topOpt = marksArr.filter(m => m.isOpt).slice(0, 1);
            
            // Display all
            [english, ...marksArr].forEach(m => {
                container.innerHTML += `<div class="subject-row"><span>${m.name}</span><b>${m.score}</b></div>`;
            });

            // Calc Percentage
            let total = english.score + marksArr.slice(0,4).reduce((a,b)=>a+b.score, 0);
            let perc = Math.round(total / 5);
            document.getElementById('avg-val').innerText = perc + "%";
            document.getElementById('grade-val').innerText = perc >= 33 ? 'PASS' : 'FAIL';
            document.getElementById('statusRibbon').style.background = perc >= 33 ? '#22c55e' : '#ef4444';
        }

        function drawChart(att) {
            const ctx = document.getElementById('attendanceChart').getContext('2d');
            const months = ['apr','may','jul','aug','sep','oct','nov','dec','jan','feb','mar'];
            const data = months.map(m => parseInt(att[m]) || 0);
            
            const avg = Math.round(data.reduce((a,b)=>a+b,0) / 11);
            document.getElementById('att-val').innerText = avg + "%";

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Apr','May','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar'],
                    datasets: [{ label: 'Att %', data: data, borderColor: '#003366', tension: 0.3, fill: true, backgroundColor: 'rgba(0,51,102,0.1)' }]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, max: 100 } } }
            });
        }
    </script>
</body>
</html>

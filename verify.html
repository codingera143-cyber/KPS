<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Payment | KPS Secure</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --gold: #d4aa00;
            --dark: #111;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            background-color: var(--dark);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--glass);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid rgba(212, 170, 0, 0.2);
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .loader {
            border: 3px solid #333;
            border-top: 3px solid var(--gold);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        h2 { color: var(--gold); margin-top: 0; font-size: 1.2rem; }
        p { color: #aaa; font-size: 0.9rem; }

        .btn-home {
            margin-top: 20px;
            display: inline-block;
            padding: 10px 20px;
            background: var(--gold);
            color: #000;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 0.8rem;
            transition: 0.3s;
        }

        /* Mobile Optimization */
        @media (max-width: 480px) {
            .container { padding: 20px; }
            h2 { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <div class="container" id="mainCard">
        <div class="loader-container" id="statusUI">
            <div class="loader"></div>
            <h2>Verifying Credentials</h2>
            <p>Connecting to secure school database...</p>
        </div>
    </div>

    <script>
        // --- 1. FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyCQ6S-YfO61gEfB2Ad7neDU-nG4WNn1z8E",
            authDomain: "kanpur-public-school-d8f4a.firebaseapp.com",
            projectId: "kanpur-public-school-d8f4a",
            storageBucket: "kanpur-public-school-d8f4a.firebasestorage.app",
            messagingSenderId: "421329321742",
            appId: "1:421329321742:web:0cf01ae45063566bc9215f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- 2. LOGIC ---
        const urlParams = new URLSearchParams(window.location.search);
        const txId = urlParams.get('tx');
        const sn = urlParams.get('sn');

        async function verifyReceipt() {
            // Delay slightly for smooth transition
            await new Promise(r => setTimeout(r, 1200));

            if (!txId || !sn) {
                renderResponse('⚠️ Invalid Link', 'This QR code does not contain valid data.', 'warning');
                return;
            }

            try {
                // Check Firebase
                const docRef = db.collection("payments").doc(txId);
                const doc = await docRef.get();

                if (doc.exists && doc.data().studentID == sn) {
                    const data = doc.data();
                    renderResponse('✅ Authentic Receipt', 
                        `<b>Student:</b> ${data.name.toUpperCase()}<br><b>Amount:</b> ₹${data.amount}<br><b>Date:</b> ${data.date}`, 
                        'success');
                } else {
                    renderResponse('❌ Verification Failed', 'No record found. This receipt may be forged or canceled.', 'error');
                }
            } catch (err) {
                renderResponse('System Error', 'Network issue. Please check your connection.', 'info');
            }
        }

        function renderResponse(title, message, iconType) {
            document.getElementById('statusUI').style.display = 'none';
            
            // Show result in card
            const card = document.getElementById('mainCard');
            card.innerHTML = `
                <div style="font-size: 3rem; margin-bottom: 10px;">${iconType === 'success' ? '🛡️' : '🛑'}</div>
                <h2>${title}</h2>
                <p style="color:#eee; line-height:1.6;">${message}</p>
                <a href="https://kpskannauj.com" class="btn-home">Return to Portal</a>
            `;

            // Also show a nice popup for extra impact
            Swal.fire({
                title: title,
                html: message,
                icon: iconType,
                background: '#111',
                color: '#fff',
                confirmButtonColor: '#d4aa00'
            });
        }

        verifyReceipt();
// --- COMPLETE UI LOCKDOWN ---

// 1. Disable Right-Click
document.addEventListener('contextmenu', e => e.preventDefault());

// 2. Disable Key Shortcuts (Windows & Mac)
document.onkeydown = function(e) {
    // Disable F12
    if (e.keyCode == 123) return false;

    // Disable Ctrl+U or Cmd+U (View Source)
    if ((e.ctrlKey || e.metaKey) && e.keyCode == 85) return false;

    // Disable Ctrl+Shift+I / Cmd+Opt+I (Inspect)
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.keyCode == 73) return false;

    // Disable Ctrl+Shift+J / Cmd+Opt+J (Console)
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.keyCode == 74) return false;

    // Disable Ctrl+Shift+C / Cmd+Opt+C (Element Selector)
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.keyCode == 67) return false;

    // Disable Ctrl+S / Cmd+S (Save Page)
    if ((e.ctrlKey || e.metaKey) && e.keyCode == 83) return false;
};

// 3. Prevent Text/Image Selection (Optional but Professional)
// Isse koi aapka data copy-paste nahi kar payega
document.onselectstart = () => false;
    </script>
</body>
</html>

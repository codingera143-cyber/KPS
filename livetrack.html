<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPS | Advanced Live GPS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --kps-blue: #003366;
            --kps-gold: #d4aa00;
            --bg-light: #f8f9fa;
        }

        body { font-family: 'Inter', sans-serif; margin: 0; background: var(--bg-light); overflow: hidden; }

        /* Header UI */
        .nav-header {
            background: var(--kps-blue);
            color: white;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 4px solid var(--kps-gold);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 2000;
            position: relative;
        }

        .btn-home {
            background: var(--kps-gold);
            color: var(--kps-blue);
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 13px;
            text-transform: uppercase;
        }

        /* Map Styling */
        #map { height: calc(100vh - 65px); width: 100%; z-index: 1; }

        /* Dashboard Overlay */
        .bus-dashboard {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 450px;
            background: rgba(0, 51, 102, 0.95);
            backdrop-filter: blur(10px);
            border: 2px solid var(--kps-gold);
            border-radius: 20px;
            padding: 20px;
            color: white;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            text-align: center;
            margin-top: 15px;
        }

        .stat-card {
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(212, 170, 0, 0.3);
        }

        .stat-val { color: var(--kps-gold); font-size: 18px; font-weight: bold; display: block; }
        .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #ccc; }

        .live-indicator {
            position: absolute;
            top: -10px;
            right: 20px;
            background: #ff3d00;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: bold;
            animation: blink 1.5s infinite;
        }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* Cleaning Leaflet Ukraine/Watermark */
        .leaflet-control-attribution { display: none !important; }
        .leaflet-bar a { background-color: var(--kps-blue) !important; color: var(--kps-gold) !important; }
    </style>
</head>
<body>

    <div class="nav-header">
        <a href="index.html" class="btn-home">🏠 Home</a>
        <div style="text-align: right;">
            <div style="font-size: 10px; letter-spacing: 2px; color: var(--kps-gold);">KPS KANNAUJ</div>
            <div style="font-size: 16px; font-weight: bold;">FLEET TRACKER</div>
        </div>
    </div>

    <div id="map"></div>

    <div class="bus-dashboard">
        <div class="live-indicator">● LIVE SATELLITE</div>
        <div style="display: flex; align-items: center; gap: 15px;">
            <div style="background: var(--kps-gold); padding: 10px; border-radius: 12px;">
                <img src="https://cdn-icons-png.flaticon.com/512/1048/1048313.png" width="30" alt="bus">
            </div>
            <div>
                <h3 style="margin: 0; font-size: 18px;">Route 04 - Balaji Area</h3>
                <p style="margin: 0; font-size: 12px; color: #aaa;" id="currentLoc">Fetching precision location...</p>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-val" id="speedVal">0 km/h</span>
                <span class="stat-label">Speed</span>
            </div>
            <div class="stat-card">
                <span class="stat-val" id="studentCount">24</span>
                <span class="stat-label">Students</span>
            </div>
            <div class="stat-card">
                <span class="stat-val" id="etaVal">8m</span>
                <span class="stat-label">To School</span>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize Map focusing on Kannauj
        var map = L.map('map', { zoomControl: false }).setView([27.0556, 79.9135], 16);

        // Google Maps Style Tiles (Anti-Ukraine Flag / Clean Look)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);

        // Custom Bus Marker
        var busIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/3448/3448339.png',
            iconSize: [45, 45],
            iconAnchor: [22, 22]
        });

        var marker = L.marker([27.0556, 79.9135], { icon: busIcon }).addTo(map);

        // FUNCTIONAL GPS LOGIC
        // 1 Lakh Deal ke liye: "Sir, hum browser ki Geolocation API aur school gateway API dono sync kar sakte hain"
        function updateLiveGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition((position) => {
                    // Actual Hardware GPS API hone par yahan fetch() aayega
                    // Demo ke liye simulation:
                    let lat = position.coords.latitude + (Math.random() * 0.001);
                    let lng = position.coords.longitude + (Math.random() * 0.001);
                    let speed = Math.floor(Math.random() * (45 - 20) + 20); // Real-time speed simulation
                    let students = Math.floor(Math.random() * (30 - 20) + 20); // Random student count

                    let newPos = [lat, lng];
                    marker.setLatLng(newPos);
                    map.panTo(newPos);

                    // Update UI
                    document.getElementById('speedVal').innerText = speed + " km/h";
                    document.getElementById('studentCount').innerText = students;
                    document.getElementById('currentLoc').innerText = "Crossing Makrand Nagar, Kannauj";
                });
            }
        }

        // Real-time Update every 3 seconds
        setInterval(updateLiveGPS, 3000);
    </script>
</body>
</html>
